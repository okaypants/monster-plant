<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kalimba-Score · Monster Plant</title>
<meta name="theme-color" content="#EFECE4">
<meta name="description" content="Kalimbasizer — a thumb-friendly kalimba-style instrument for your phone, with synth voices and a built-in recorder.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalimbasizer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#EFECE4;--ink:#1C1C1B;--g1:#D9D6CE;--g2:#9A978F;--te:#FF6A2B;--text:#1C1C1B;--cap:#F7F4EE;--cream:#FBF8F1;--track:#FBF8F1;--selbg:#1C1C1B;--selfg:#EFECE4;--fill:#F2B8A2;--ledoff:#D3CFC6}
html.night{--paper:#161922;--ink:#05060A;--g1:#3A4050;--g2:#8A8FA0;--text:#E9E4D8;--cap:#262B38;--cream:#DDD8CC;--track:#1A1E29;--selbg:#DDD8CC;--selfg:#05060A;--fill:#A8695A;--ledoff:#3A4050}
html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#panel{position:fixed;top:0;left:0;right:0;display:grid;grid-template-columns:repeat(20,1fr);gap:8px;padding:10px 12px 0;z-index:2;font-family:'IBM Plex Mono',ui-monospace,monospace;max-width:660px;margin:0 auto}
.cap{position:relative;grid-column:span 4;height:58px;min-width:0;border:1.4px solid var(--ink);border-radius:15px;background:var(--cap);box-shadow:3px 3px 0 var(--ink);color:var(--text);text-align:left;padding:8px 9px;font:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer;transition:transform .05s,box-shadow .05s}
.cap.down{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.cap .lbl{display:block;font-size:8.5px;letter-spacing:.1em;opacity:.5;white-space:nowrap;overflow:hidden;padding-right:12px}
@media (max-width:900px){.cap .num{display:none}}
.cap .val{display:block;font-size:15px;font-weight:600;margin-top:9px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:clip}
.cap .led{position:absolute;right:8px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--ledoff);border:1px solid var(--ink);box-sizing:border-box}
.cap.dis{opacity:.32;box-shadow:1px 1px 0 var(--ink);cursor:default}
.cap.on .led{background:var(--te);box-shadow:0 0 6px var(--te)}
.cap .sw{position:absolute;right:8px;top:8px;width:10px;height:10px;border-radius:50%;border:1px solid var(--ink);box-sizing:border-box}
#sheet{position:fixed;inset:0;z-index:4;display:none;font-family:'IBM Plex Mono',ui-monospace,monospace;color:var(--text)}
#sheet.open{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(28,28,27,.32)}
#sheet .pane{position:absolute;left:0;right:0;bottom:0;max-width:660px;margin:0 auto;background:var(--paper);border:1.4px solid var(--ink);border-bottom:none;border-radius:22px 22px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;box-sizing:border-box;animation:up .16s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
#sheet .hd{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px;font-size:9px;letter-spacing:.16em;opacity:.7}
#sheet .hd button{font:inherit;letter-spacing:.12em;border:1.4px solid var(--ink);background:transparent;border-radius:999px;padding:9px 16px;color:var(--text)}
#sheet .grid{display:grid;gap:9px}
.opt{position:relative;min-height:56px;border:1.4px solid var(--ink);border-radius:14px;background:var(--cap);box-shadow:3px 3px 0 var(--ink);font:inherit;color:var(--text);text-align:left;padding:9px 11px;-webkit-tap-highlight-color:transparent}
.opt b{display:block;font-size:16px;font-weight:600}
.opt small{display:block;font-size:8.5px;letter-spacing:.08em;opacity:.55;margin-top:4px}
.opt.sel{background:var(--selbg);color:var(--selfg)}
.opt .sw{position:absolute;right:10px;top:10px;width:12px;height:12px;border-radius:50%;border:1px solid var(--ink)}
.opt.sel .sw{border-color:var(--selfg)}
.cap.oct{grid-column:span 5;display:flex;align-items:stretch;padding:0;height:50px}
.cap.oct button{flex:0 0 31%;font:600 22px/1 'IBM Plex Mono',monospace;background:transparent;border:none;color:var(--text);-webkit-tap-highlight-color:transparent}
.cap.oct button:first-child{border-right:1.4px solid var(--ink)}.cap.oct button:last-child{border-left:1.4px solid var(--ink)}
.cap.oct button.down{background:var(--g1)}
.cap.oct .mid{flex:1;min-width:0;text-align:center;padding-top:8px}.cap.oct .lbl{padding-right:0;letter-spacing:.04em}.cap.oct .val{margin-top:5px}
.cap.wide{grid-column:span 4;height:50px}.cap.wide .val{margin-top:6px}
.cap.nar{grid-column:span 3;padding:8px 6px}.cap.nar .val{font-size:12px;margin-top:8px}.cap.nar .lbl{padding-right:0}
@media (min-aspect-ratio:11/10){#panel{grid-template-columns:repeat(5,1fr) 1.6fr 1fr 1fr 1fr 1fr 1fr;max-width:1100px}.cap.nar{padding:8px 9px}.cap.nar .val{font-size:15px;margin-top:9px}.cap,.cap.oct,.cap.wide,.cap.nar{grid-column:auto;height:58px}.cap.wide .val{margin-top:9px}}
#bMet.on{background:var(--selbg);color:var(--selfg)}#bMet.on .lbl{opacity:.7}
#bRec .val{color:#D8352A}
#bRec.recording{background:var(--selbg);color:var(--selfg)}
#bRec.recording .lbl{opacity:.7}
#bRec.recording .led{background:#E5372B;box-shadow:0 0 8px #E5372B;animation:blink 1s steps(2) infinite}
#bRec.recording .val{color:var(--selfg);font-size:12px}
@keyframes blink{50%{opacity:.25}}
.knob{display:block;border:1.4px solid var(--ink);border-radius:14px;background:var(--cap);box-shadow:3px 3px 0 var(--ink);padding:7px 12px 6px}
.knob .kh{display:flex;align-items:baseline;gap:8px}.knob b{font-size:15px;font-weight:600}.knob small{flex:1;min-width:0;font-size:8.5px;letter-spacing:.06em;opacity:.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.knob output{font-size:11px;font-weight:600;opacity:.75}
.knob .ends{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.06em;opacity:.6}.knob .ends i{font-style:normal}
.knob input{-webkit-appearance:none;appearance:none;outline:none;display:block;width:100%;height:30px;margin:1px 0 0;background:transparent;touch-action:pan-y}
.knob input::-webkit-slider-runnable-track{height:12px;border:1.4px solid var(--ink);border-radius:999px;background:linear-gradient(to right,var(--fill) var(--p),var(--track) var(--p))}
.knob input::-moz-range-track{height:12px;border:1.4px solid var(--ink);border-radius:999px;background:linear-gradient(to right,var(--fill) var(--p),var(--track) var(--p))}
.knob input::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-9.4px;border-radius:50%;background:var(--cream);border:1.4px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.knob input::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--cream);border:1.4px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.knob.mod b::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--te);margin-left:6px;vertical-align:middle}
#shReset{font:inherit;font-size:11px;letter-spacing:.12em;border:1.4px solid var(--ink);background:transparent;border-radius:999px;padding:12px 16px;color:var(--text)}
.take{display:flex;align-items:center;gap:8px;border:1.4px solid var(--ink);border-radius:14px;background:var(--cap);box-shadow:3px 3px 0 var(--ink);padding:7px}
.take button{flex:0 0 46px;height:46px;border:1.4px solid var(--ink);border-radius:11px;background:transparent;color:var(--text);font:600 16px/1 'IBM Plex Mono',monospace;-webkit-tap-highlight-color:transparent}
.take button.pl.on{background:var(--selbg);color:var(--selfg)}
.take .rm{font-size:13px}
.take .nm{flex:1;min-width:0}.take .nm b{display:block;font-size:15px}.take .nm small{display:block;font-size:8.5px;opacity:.55;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em}
.empty{font-size:11px;line-height:1.6;opacity:.6;padding:18px 6px;text-align:center}
#start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.6vh,22px);background:var(--paper);font:500 16px Fredoka,ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;color:var(--text);cursor:pointer}
#start svg{width:min(74vw,46vh);height:auto;overflow:visible}
#start svg .tn{transform-box:fill-box;transform-origin:50% 8%;animation:twang 3.6s ease-out infinite}
@keyframes twang{0%,100%{transform:none}3%{transform:rotate(2.2deg)}9%{transform:rotate(-1.6deg)}15%{transform:rotate(1deg)}22%{transform:rotate(-.5deg)}30%{transform:none}}
@media (prefers-reduced-motion:reduce){#start svg .tn{animation:none}}
#start .tag{margin:calc(clamp(12px,2.6vh,22px)*-.55) 0 0;font-size:clamp(13px,min(4vw,3.6vh),20px);letter-spacing:.04em;opacity:.7} /* the game's own name for it (Jackie, Nov 27: "Call it kalimba-score, a practical kalimbasizer") */
/* THE OPENING PICTURE says what this is for (Jackie, Nov 27: "same aesthetic but slightly more indicative of what we're doing"): the kalimba's sound hole is a film reel that turns slowly, and its bridge is a clapperboard's striped arm. */
#start .reel{transform-origin:140px 278px;animation:reel 9s steps(30) infinite}@keyframes reel{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){#start .reel{animation:none}}
#start h1{margin:0;font:inherit;font-weight:700;font-size:clamp(28px,min(11vw,10vh),64px);line-height:1;letter-spacing:.02em;white-space:nowrap}
#start .go{color:var(--ink);font-weight:600;font-size:clamp(17px,min(5.2vw,5.5vh),24px);letter-spacing:.04em;padding:.55em 1.5em;border:2.5px solid var(--ink);border-radius:999px;background:var(--cream);box-shadow:4px 4px 0 var(--ink);animation:go 1.6s steps(1) infinite}
@keyframes go{0%,100%{background:var(--cream)}50%{background:#F2B8A2}}
@media (prefers-reduced-motion:reduce){#start .go{animation:none}}
#thm{font:inherit;font-size:14px;letter-spacing:.04em;color:var(--text);opacity:.65;background:transparent;border:none;padding:10px 16px;margin-top:2px;-webkit-tap-highlight-color:transparent}
/* night: a thin stripe of colour down each button's edge, with the text moved clear of it */
html.night .cap{overflow:hidden;padding-left:14px}html.night .cap.oct{padding-left:0}html.night .cap.nar{padding-left:9px;padding-right:3px}html.night .cap.nar .val{font-size:11px}html.night .cap.nar .led{right:5px}
html.night .cap::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--st)}html.night .cap.nar::before{width:3px}
html.night .cap.oct button:first-child{padding-left:5px}
@media (min-aspect-ratio:11/10){html.night .cap,html.night .cap.nar{padding-left:11px;padding-right:6px}html.night .cap.oct{padding:0}html.night .cap .val,html.night .cap.nar .val{font-size:14px}html.night .cap.nar .led{right:8px}}
#panel>:nth-child(1){--st:var(--snd)}#panel>:nth-child(2){--st:#EBDDA0}#panel>:nth-child(3){--st:#BFDDB6}#panel>:nth-child(4){--st:#A9D8D6}#panel>:nth-child(5){--st:#C4C3EC}#panel>:nth-child(6){--st:#E3C2DC}#panel>:nth-child(7){--st:#F0B9A4}#panel>:nth-child(8){--st:#EBDDA0}#panel>:nth-child(9){--st:#BFDDB6}#panel>:nth-child(10){--st:#A9D8D6}

/* MONSTER PLANT'S COPY (Jackie, Nov 27: "I do like a monster-plant custom version of kalimbasizer"): a film plays in a strip under the
   buttons, and SCORE IT starts the film and the recorder together, so what you play is kept as that film's soundtrack. */
#kfilm{grid-column:1/-1;display:flex;gap:8px;align-items:stretch;height:clamp(84px,24vh,200px)}
#kv{height:100%;aspect-ratio:4/3;background:#000;border:1.4px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);object-fit:contain;flex:none}
#kside{flex:1;min-width:0;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;align-content:start}
.cap.kcap{grid-column:auto;height:auto;min-height:58px}
#kGo.recording{background:var(--selbg);color:var(--selfg)}#kGo.recording .led{background:#E5372B;box-shadow:0 0 8px #E5372B;animation:blink 1s steps(2) infinite}
@media (max-width:560px){#kside{grid-template-columns:1fr}.cap.kcap{min-height:0;padding:5px 9px}.cap.kcap .val{margin-top:3px;font-size:13px}}
/* WATCHING WHILE YOU PLAY (Jackie, Nov 27: "the in game kalimbasizer needs fewer keys or something to have a larger screen to watch
   maybe? or maybe a UI shift"). With a film chosen and the screen sideways, the film takes the left of the screen at full height and
   the keys the right, two rows of seven. SET UP goes back to the whole instrument with the film small. */
@media (min-aspect-ratio:11/10){
html.film #panel{left:var(--padw,0px);right:auto;top:0;bottom:0;width:calc(100vw - 2*var(--padw,0px));max-width:none;margin:0;display:flex;flex-direction:column;padding:8px 6px;box-sizing:border-box}
html.film #panel>.cap{display:none}html.film #panel>.cap.oct{display:none}
html.film #kfilm{flex:1;min-height:0;height:auto;flex-direction:column;position:relative}
html.film #kv{flex:1;min-height:0;height:auto;width:100%;aspect-ratio:auto}
html.film #kside{flex:none;grid-template-columns:repeat(5,1fr);gap:5px} /* with the film big there are ten buttons in two rows */html.film #kbar{display:block}
html.film .cap.kcap{display:block;min-height:0;height:auto;padding:4px 6px}html.film .cap.kcap .lbl{font-size:8px}html.film .cap.kcap .val{margin-top:2px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
}
#kside{grid-template-columns:1.4fr 1fr 1fr}
/* UPRIGHT, FOR THE THUMBS (Jackie, Nov 27: "I think we need to switch kalimba-score to a vertical for thumb comfort"). With the phone
   upright and a film chosen, the film is across the top, its bar and buttons under it, and the keys fill the bottom half where
   the thumbs are. */
@media (max-aspect-ratio:11/10){
html.film #panel{display:flex;flex-direction:column;max-width:none;padding:8px 8px 0;box-sizing:border-box}
html.film #panel>.cap{display:none}
html.film #kfilm{flex-direction:column;height:auto;gap:6px}
html.film #kv{width:100%;height:auto;aspect-ratio:4/3;max-height:40vh}
html.film #kbar{display:block}
html.film #kside{grid-template-columns:repeat(5,1fr);gap:5px}
html.film .cap.kcap{display:block;min-height:0;height:auto;padding:5px 7px}html.film .cap.kcap .lbl{font-size:8px}html.film .cap.kcap .val{margin-top:2px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
}
html:not(.film) .kx{display:none}
#ksetup{display:none}html.film.setup #ksetup{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;flex:none}
html.film #ksetup .cap{display:block;grid-column:auto;height:auto;min-height:0;padding:4px 6px;overflow:hidden}html.film #ksetup .cap .lbl{font-size:8px}html.film #ksetup .cap .val{margin-top:2px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}html.film #ksetup .cap .num{display:none}
html.film #ksetup .cap.oct{display:flex;padding:0}html.film #ksetup #bRec,html.film #ksetup #bKeys,html.film #ksetup #bMet{display:none} /* recording and the click have their own buttons under the film, and the number of keys is fixed here */
#knofilm{position:absolute;left:0;top:0;right:0;z-index:1;border:0;background:transparent;color:#FBF8F1;font:600 14px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.04em;cursor:pointer;aspect-ratio:4/3;max-height:100%} /* the film's own controls show only with the film big */
/* the bar under the film: where you are, the parts you have recorded (orange), and a loop if one is set (outlined). Drag along it to move. */
#kbar{display:none;position:relative;flex:none;height:16px;border:1.4px solid var(--ink);border-radius:8px;background:#2A2A28;overflow:hidden;touch-action:none;cursor:pointer}
#kbarP i{position:absolute;top:3px;bottom:3px;background:#FF6A2B;opacity:.8;border-radius:3px}#kbarL{position:absolute;top:0;bottom:0;display:none;border-left:2px solid #FBF8F1;border-right:2px solid #FBF8F1;background:rgba(251,248,241,.18)}
#kbarH{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#FBF8F1}
#kkParts{display:flex;flex-direction:column;gap:4px;max-height:22vh;overflow:auto}#kkParts div{display:flex;align-items:center;justify-content:space-between;font-size:12px;border:1.4px solid var(--ink);border-radius:8px;padding:3px 4px 3px 9px;background:#FBF8F1;color:#1C1C1B}#kkParts button{font:inherit;font-size:11px;border:1.4px solid #1C1C1B;border-radius:7px;background:#F2B8A2;padding:3px 8px;cursor:pointer}
#kcount{position:absolute;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;font:700 clamp(40px,22vh,120px) 'IBM Plex Mono',monospace;color:#FBF8F1;text-shadow:3px 3px 0 #1C1C1B;pointer-events:none}
#kcount.on{display:flex}#kfilm{position:relative}
#kkeep{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(28,28,27,.55);font-family:'IBM Plex Mono',ui-monospace,monospace}
#kkeep.on{display:flex}#kkeep .box{background:var(--cap);color:var(--text);border:1.4px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);padding:14px 16px;width:min(92vw,430px);display:flex;flex-direction:column;gap:9px}
#kkeep h3{margin:0;font-size:15px;letter-spacing:.06em}#kkeep p{margin:0;font-size:12px;opacity:.75}
#kkeep input{font:inherit;font-size:16px;padding:8px 10px;border:1.4px solid var(--ink);border-radius:10px;background:#FBF8F1;color:#1C1C1B}
#kkeep .cards{display:flex;gap:8px}#kkeep .cards button{flex:1;height:38px;border:1.4px solid var(--ink);border-radius:10px;font:inherit;font-size:11px;cursor:pointer}#kkeep .cards button.on{outline:3px solid #FF6A2B;outline-offset:1px}
#kkeep .row{display:flex;gap:8px}#kkeep .row button{flex:1;font:inherit;font-size:13px;font-weight:600;padding:10px 6px;border:1.4px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);background:#FBF8F1;color:#1C1C1B;cursor:pointer}#kkeep .row button.go{background:#FF6A2B}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <button class="cap" id="bSound"><span class="lbl"><span class="num">01 </span>SOUND</span><span class="val">wood</span><i class="sw"></i></button>
  <button class="cap" id="bRoot"><span class="lbl"><span class="num">02 </span>KEY</span><span class="val">C</span><i class="led"></i></button>
  <button class="cap" id="bScale"><span class="lbl"><span class="num">03 </span>SCALE</span><span class="val">maj</span><i class="led"></i></button>
  <button class="cap" id="bKeys"><span class="lbl"><span class="num">04 </span>ROWS</span><span class="val">2×7</span><i class="led"></i></button>
  <button class="cap" id="bShape"><span class="lbl"><span class="num">05 </span>SHAPE</span><span class="val">stock</span><i class="led"></i></button>
  <div class="cap oct" id="oct"><button id="oDn" aria-label="octave down">−</button><span class="mid"><span class="lbl">OCT</span><span class="val" id="oVal">0</span></span><button id="oUp" aria-label="octave up">+</button></div>
  <button class="cap wide nar" id="bGlide"><span class="lbl">GLIDE</span><span class="val">short</span></button>
  <button class="cap wide nar" id="bHold"><span class="lbl">HOLD</span><span class="val">off</span><i class="led"></i></button>
  <button class="cap wide nar" id="bMet"><span class="lbl">CLICK</span><span class="val">off</span></button>
  <button class="cap wide nar" id="bRec"><span class="lbl">REC</span><span class="val">●</span><i class="led"></i></button>
  <button class="cap wide nar" id="bTakes"><span class="lbl">TAKES</span><span class="val">0</span></button>
  <div id="kfilm"><video id="kv" playsinline muted preload="none"></video><div id="kcount"></div>
   <div id="kbar"><span id="kbarP"></span><em id="kbarL"></em><b id="kbarH"></b></div><div id="kside">
    <button class="cap kcap kx" id="kRew"><span class="lbl">BACK</span><span class="val">◀ 10s</span></button>
    <button class="cap kcap kx" id="kPlay"><span class="lbl" id="kTime">0:00</span><span class="val" id="kPlayV">▶ play</span></button>
    <button class="cap kcap kx" id="kFwd"><span class="lbl">ON</span><span class="val">10s ▶</span></button>
    <button class="cap kcap kx" id="kLoop"><span class="lbl">LOOP</span><span class="val" id="kLoopV">off</span></button>

const now=()=>AC.currentTime;

function noiseSrc(){const s=AC.createBufferSource();s.buffer=NOISE;s.loop=true;s.playbackRate.value=.8+Math.random()*.4;return s}

function squish(f,v,pn){if(!AC)return;const t=now(),o=outNode(pn,v),env=AC.createGain();env.connect(o);

  const s=AC.createOscillator();s.frequency.value=f;const g=AC.createGain();s.connect(g);g.connect(o);adsr(g.gain,t,.002,.5,.22+Math.random()*.2);s.start(t);s.stop(t+.5);

  const g=AC.createGain();n.connect(lp);lp.connect(g);g.connect(o);adsr(g.gain,t,.005,.8,.7);n.start(t);n.stop(t+.9)}
function thump(v,pn){if(!AC)return;const t=now(),o=outNode(pn,v);
  const s=AC.createOscillator();s.frequency.setValueAtTime(150,t);s.frequency.exponentialRampToValueAtTime(40,t+.2);

  a.connect(lp);b.connect(lp);c.connect(cg);cg.connect(lp);a.start();b.start();c.start();env.gain.setTargetAtTime(.12,t,.08);
  return{set(f2,open,amp){const t=now();a.frequency.setTargetAtTime(f2,t,.04);b.frequency.setTargetAtTime(f2,t,.04);c.frequency.setTargetAtTime(f2/2,t,.04);

function baseRoot(){const[,root,S]=TUNE(),[r,n]=cfg(),N=r*n;let d=clamp(Math.floor(N/S.length/2-.5),0,3);while(d>0&&root/Math.pow(2,d)<60)d--;return root/Math.pow(2,d)}
let octave=0,glideI=1;const GLIDES=[['off',0],['short',1],['long',2.6]];
function freqOf(i){const S=TUNE()[2],n=S.length;return baseRoot()*Math.pow(2,octave+(Math.floor(i/n)*12+S[i%n])/12)}

const noteName=f=>{const m=Math.round(69+12*Math.log2(f/440));return NAMES[((m%12)+12)%12]+(Math.floor(m/12)-1)};

function kal(type,f,bright,v,pn){if(!AC)return;const t=now(),o=outNode(pn,v);

   const x=AC.createOscillator();x.type=wave;
    x.frequency.setValueAtTime(f*ratio*1.008,t);x.frequency.exponentialRampToValueAtTime(f*ratio,t+.03);x.detune.value=det;
    const g=AC.createGain();x.connect(g);g.connect(dest);adsr(g.gain,t,a,Math.max(gain,.0003),dec);x.start(t);x.stop(t+a+dec+.05);return x};
  const click=(fr,q,gain,dec)=>{const n=noiseSrc(),bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=fr;bp.Q.value=q;
    const g=AC.createGain();n.connect(bp);bp.connect(g);g.connect(o);adsr(g.gain,t,.001,Math.max(gain,.0003),dec);n.start(t,Math.random()*.5);n.stop(t+dec+.05)};
  if(type==='wood'){part(1,.7,2.4);part(6.27,.22*bright,.28);part(17.5,.06*bright,.07);click(2800,1.2,.35*bright+.08,.012)}
  else if(type==='felt'){part(1,.6,1.5,'triangle',0,tone,.008);part(2,.12,.6);click(400,.8,.25,.03)}
  else if(type==='box'){part(2,.5,1.3);part(4,.18*bright+.05,.5);part(6,.08*bright,.2);click(6000,2,.2*bright,.006)}
  else if(type==='metal'){[1,2.76,5.4,8.93].forEach((r,i)=>part(r,[.5,.22,.13,.06][i]*(i?bright+.3:1),[3.6,2,1.1,.5][i]));part(1,.22,3.6,'sine',-5)}}

const SYN_TYPES=['dream','haze','deep','moog','arp','electro','strings','vox'];

// ───────── geometry ─────────
let G={},rows=[];

// ───────── play ─────────

// ───────── motes: dust that lifts off played keys. Steady playing builds `flow`, which keeps motes alive longer,
// warms their colour, pulls them into a slow swirl and links neighbours; lose the pulse and they sink and fade ─────────

    let ok=false;if(lastIOI&&d<2500){const r=d/lastIOI;ok=[.5,1,2].some(k=>Math.abs(r/k-1)<.1)} // same gap as last time, or half/double it
    if(!ok&&metOn&&AC){const half=30/metBpm,ph=((now()-metNext)%half+half)%half;ok=Math.min(ph,half-ph)<half*.14} // or on the click's grid

function drawMotes(){const n=motes.length;if(!n)return;const col=mix(NIGHT?CREAM:INK,TE,flow*.85),al=m=>Math.min(1,m.life*2.5)*Math.min(1,m.age/8);

    sv.onclick=async()=>{const ext=/mp4/.test(tk.mime)?'mp4':'webm',name=`kalimba-score ${tk.name}.${ext}`;try{await saveLocal(name,tk.blob,tk.mime);sv.textContent='✓'}catch(e){sv.textContent=e&&e.name==='AbortError'?'↓':'!'}};
    shGrid.appendChild(row)});
  if(takes.length)shGrid.insertAdjacentHTML('beforeend','<div class="empty">takes clear when you close the app · ↓ saves one</div>');
  sheet.classList.add('open')}
press($('bRec'),()=>{if(REC_MIME===null){say('rec not supported here');return}if(!AC)return;rec?stopRec():startRec()});
press($('bTakes'),openTakes);
if(REC_MIME===null)$('bRec').querySelector('.val').textContent='n/a';
press($('bKeys'),()=>{const land=isLand(),list=land?OPTS.l:OPTS.p,cur=land?optL:optP;
  openSheet('04 · ROWS',list.map(([r,n],i)=>({label:`${r}×${n}`,sub:`${r*n} keys`,sel:i===cur,act:()=>{if(land)optL=i;else optP=i;allOff();pointers.forEach(p=>p.t=null);geo()}})),84)});
// ───────── metronome: goes straight to the speakers, bypassing the chain the recorder taps ─────────
const TEMPOS=[60,72,84,96,108,120,132,144,160];let metOn=false,metBpm=84,metNext=0,metBeat=0,metTimer=null,metGain=null,metFlash=-1e9,metShown=0,metVol=1;const MET_VOLS=[['soft',.3],['loud',.65],['max',1]];
function metTick(){if(!AC||!metOn)return;while(metNext<now()+.12){const t=Math.max(metNext,now()),acc=metBeat%4===0,o=AC.createOscillator(),g=AC.createGain();
  o.type='square';o.frequency.value=acc?1570:1050;o.connect(g);g.connect(metGain);adsr(g.gain,t,.001,acc?.45:.3,.035);o.start(t);o.stop(t+.06); // woodblock-ish: square body…
  const n=noiseSrc(),hp=AC.createBiquadFilter(),ng=AC.createGain();hp.type='highpass';hp.frequency.value=3000;n.connect(hp);hp.connect(ng);ng.connect(metGain);adsr(ng.gain,t,.001,acc?.5:.35,.012);n.start(t);n.stop(t+.03); // …plus a bright tick that cuts through
  const bi=metBeat%4;setTimeout(()=>{metFlash=performance.now();metShown=bi},Math.max(0,(t-now())*1000));metBeat++;metNext+=60/metBpm}}
function setMet(bpm){clearInterval(metTimer);metOn=!!bpm&&!!AC;const el=$('bMet');el.querySelector('.val').textContent=metOn?bpm:'off';$('kMetV').textContent=metOn?bpm:'off';if(!metOn){el.classList.remove('on');applyShape();return}
  metBpm=bpm;if(!metGain){metGain=AC.createGain();metGain.gain.value=MET_VOLS[metVol][1];metGain.connect(AC.destination)}
  /* the click changes nothing about the sound (Jackie, Nov 27: "the synth is pulsing with the metronome which isn't great"): the echo and the wobble used to take their time from it, so notes pulsed on the beat. They keep their own time now. The click itself goes straight to the speaker, past the recorder, so it is never in a recording. */
  metNext=now()+.1;metBeat=0;metTimer=setInterval(metTick,25)}
/* THE METRONOME is beside the film too (Jackie, Nov 27: "we also need a metronome"): CLICK opens the same list of tempos and loudness. It is heard while you play and is never recorded. */
const metSheet=()=>openSheet('CLICK · not recorded',[{label:'off',sub:'silent',sel:!metOn,quiet:true,act:()=>setMet(0)}].concat(TEMPOS.map(b=>({label:b,sub:'bpm',sel:metOn&&b===metBpm,quiet:true,act:()=>setMet(b)})),MET_VOLS.map(([l,v],i)=>({label:l,sub:'volume',sel:i===metVol,quiet:true,act:()=>{metVol=i;if(metGain)metGain.gain.value=v}}))),76);press($('bMet'),metSheet);
// ───────── SHAPE sheet: plain-word sliders, with the synth term underneath ─────────
const KNOBS=[['echo','ECHO','tape delay','none','lots'],['verb','REVERB','room size','dry','cathedral'],
 ['tone','TONE','low-pass filter cutoff','dark','bright'],['edge','EDGE','filter resonance','smooth','whistly'],
 ['swell','SWELL','envelope attack','snappy','slow fade-in'],['tail','TAIL','envelope decay · release','short','long'],
 ['grit','GRIT','drive · saturation','clean','crunchy'],['wob','WOBBLE','LFO → filter','still','wub wub']];
function syncShape(){const mod=KNOBS.some(k=>Math.abs(SHAPE[k[0]]-SHAPE_DEF[k[0]])>.005);$('bShape').classList.toggle('on',mod);$('bShape').querySelector('.val').textContent=mod?'tweak':'stock';
  try{localStorage.setItem('kz-shape',JSON.stringify(SHAPE))}catch(e){}}
function openShape(){stopPlay();$('shTitle').textContent='05 · SHAPE THE SOUND';shGrid.style.gridTemplateColumns='repeat(auto-fill,minmax(250px,1fr))';shGrid.innerHTML='';
  KNOBS.forEach(([key,name,sub,lo,hi])=>{const el=document.createElement('label');el.className='knob';
    el.innerHTML=`<span class="kh"><b>${name}</b><small>${sub}</small><output></output></span><input type="range" min="0" max="100" step="1" aria-label="${name}"><span class="ends"><i>${lo}</i><i>${hi}</i></span>`;
    const inp=el.querySelector('input'),out=el.querySelector('output'),show=()=>{const v=Math.round(SHAPE[key]*100);inp.value=v;inp.style.setProperty('--p',v+'%');out.textContent=v;el.classList.toggle('mod',Math.abs(SHAPE[key]-SHAPE_DEF[key])>.005)};
    inp.addEventListener('input',()=>{SHAPE[key]=inp.value/100;show();applyShape();syncShape()});inp.addEventListener('change',()=>{buzz(6);preview()});show();shGrid.appendChild(el)});
  const r=document.createElement('button');r.id='shReset';r.textContent='RESET TO STOCK';r.onclick=()=>{Object.assign(SHAPE,SHAPE_DEF);applyShape();syncShape();openShape();buzz(8);preview()};shGrid.appendChild(r);
  sheet.classList.add('open')}
press($('bShape'),openShape);syncShape();

const pointers=new Map();
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(G.pads){padDown(e);return}
  const t=keyAt(e.clientX,e.clientY),nid=++uid;
  if(t&&held.has(t.idx)){dropHeld(t.idx);buzz(5);pointers.set(e.pointerId,{t,h:null,nid});return}
  pointers.set(e.pointerId,{t,h:t?noteOn(t,e.clientY,.85,nid):null,nid})});
cv.addEventListener('pointermove',e=>{const p=pointers.get(e.pointerId);if(!p)return;if('pad' in p){padMove(e);return}const t=keyAt(e.clientX,e.clientY);
  if(t!==p.t){const id=p.nid;
    if(p.h&&p.h.mono&&t&&isSyn()){p.h.t.hold=Math.max(0,p.h.t.hold-1);p.h=noteOn(t,e.clientY,.6,id)} // legato glide, no retrigger
    else{noteOff(p.h,id);p.h=t?noteOn(t,e.clientY,.6,id):null}}p.t=t});
const endP=e=>{const p=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(p&&'pad' in p){padOff(p.h,p.nid);return}if(!p||!p.h)return;if(latch&&canLatch())latchNote(p.h,p.nid);else noteOff(p.h,p.nid)};
cv.addEventListener('pointerup',endP);cv.addEventListener('pointercancel',endP);
document.addEventListener('gesturestart',e=>e.preventDefault());

let started=false;
// iOS: let Web Audio play even with the silent switch on, by holding a looping silent <audio> in "playback" mode
let unlockEl=null;
function silentWavURL(){const sr=8000,n=sr/2,b=new ArrayBuffer(44+n*2),v=new DataView(b);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function unlockAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{if(!unlockEl){unlockEl=document.createElement('audio');unlockEl.src=silentWavURL();unlockEl.loop=true;unlockEl.setAttribute('playsinline','');unlockEl.volume=.01}
    const pr=unlockEl.play();pr&&pr.catch(()=>{})}catch(e){}
  try{if(!AC)initAudio();if(AC.state!=='running')AC.resume()}catch(e){}
  // tiny blip so the context really starts on iOS
  try{const o=AC.createOscillator(),g=AC.createGain();g.gain.value=.0001;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.05)}catch(e){}}
// phones only count pointerup/touchend/click as a real gesture for sound, so re-unlock on those

['pointerup','touchend','click'].forEach(ev=>document.addEventListener(ev,()=>{if(started&&(!AC||AC.state!=='running'))unlockAudio()},{passive:true}));
$('start').addEventListener('click',e=>{e.preventDefault();unlockAudio();started=true;e.currentTarget.style.display='none';buzz(12);
  applyShape();setTimeout(preview,120)});

/* INSIDE THE GAME THERE IS NO OPENING SCREEN (Jackie, Nov 27: "I don't even want an opening screen. I just want to get straight to
   the kalimba"). The tap that opened this from the movie room's shelf is the gesture that lets sound start; where a phone still
   holds the sound back, the first touch here wakes it. Opened on its own, outside the game, the opening screen is still shown. */
if(parent!==window){$('start').style.display='none';started=true;try{unlockAudio();applyShape()}catch(e){}
  document.addEventListener('pointerdown',()=>{if(!AC||AC.state!=='running')unlockAudio()},{capture:true,passive:true});}

let lastT=performance.now();
function frame(t){const dt=Math.min(3,(t-lastT)/16.667);lastT=t;recent*=Math.pow(.985,dt);
  for(const row of rows)for(const k of row){k.ph+=1.1*dt;k.amp*=Math.pow(.94,dt);k.flash=k.hold>0?1:k.flash*Math.pow(.92,dt);k.squish*=Math.pow(.85,dt)}
  stepMotes(dt,t);
  if(metOn)$('bMet').classList.toggle('on',t-metFlash<110);
  if(rec){const v=$('bRec').querySelector('.val'),f=fmt((t-recStart)/1000);if(v.textContent!==f)v.textContent=f}
  draw(t);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>

<script>document.write('<script src="js/scores.js?v='+encodeURIComponent(new URLSearchParams(location.search).get("v")||"")+'"><\/script>')</script>
<script>
/* FILM MODE. The films come from the movie room's collection when this page is opened inside the game (same site, so the page can
   read the room's list); opened on its own it has no films and is the plain instrument. */
const KF={films:[],film:null,scoring:false,arming:false,count:0,parts:[],player:null,dirty:false,t0:0,loop:null,by:'',card:0};
try{if(parent!==window&&parent.mvKalimbaFilms){KF.films=parent.mvKalimbaFilms().flatMap(sh=>sh.films.map(f=>({...f,shelf:sh.name})));KF.src=parent.mvKalimbaSrc;}}catch(e){}
const kv=$('kv'),KCARDS=[['#1C1C1B','#FBF8F1','night'],['#F2B8A2','#1C1C1B','peach'],['#BFD8B8','#1C1C1B','moss'],['#C9C3E6','#1C1C1B','dusk']]; // title card colours: ground, lettering
/* ALWAYS THE BIG SCREEN (Jackie, Nov 27: with the film small "it looks like a kalimba which isn't good. it should always be big
   screen AND you have options to set up"). Inside the game the film is always big, even before one is chosen (the screen then
   says to tap it to choose). SET UP no longer swaps to a different view: it opens the instrument's options (sound, key, scale,
   rows, shape, octave, glide, hold, takes) in a strip above the film, and DONE on the same button puts them away. */
function kfView(){document.documentElement.classList.add('film');resize();}
function kfSetup(on){const d=document.documentElement;d.classList.toggle('setup',on===undefined?!d.classList.contains('setup'):!!on);$('kViewV').textContent=d.classList.contains('setup')?'close':'set up';resize();}
/* A FILM'S SOUNDTRACK IS BUILT IN PARTS (Jackie, Nov 27: "you should be able to record in parts and record the parts easily that will
   assemble into a single recording you can save into a finished movie"; "and maybe easily loop something? or multi track lol").
   Move to any moment of the film and RECORD: it counts 3, 2, 1 and records a part from there until you stop. Parts show orange on
   the bar under the film. Record over a stretch you have already done and both are heard, one over the other. SAVE keeps all the
   parts as the film's one soundtrack in Your films; nothing is kept until then. Choosing a film you have scored before brings its
   parts back, so you can add to it. */
function kfPlayerMake(){if(KF.player)KF.player.free();KF.player=KF.parts.length?scorePlayer({parts:KF.parts}):null;kfBar();const n=KF.parts.length;$('kSaveV').textContent=n?n+(n>1?' parts':' part'):'no parts';$('kSaveL').textContent=KF.dirty?'SAVE ●':'SAVE';}
function kfBar(){const d=kv.duration||0,b=$('kbarP'),L=$('kbarL');b.innerHTML='';if(!d){L.style.display='none';return}for(const p of KF.parts){const i=document.createElement('i');i.style.left=(p.t/d*100)+'%';i.style.width=Math.max(.8,p.dur/d*100)+'%';b.appendChild(i);}
  if(KF.loop&&KF.loop.b!=null){L.style.display='block';L.style.left=(KF.loop.a/d*100)+'%';L.style.width=((KF.loop.b-KF.loop.a)/d*100)+'%';}else L.style.display='none';}
function kfSet(f){kfQuiet();KF.film=f;{const tip=$('knofilm');if(tip)tip.style.display=f?'none':''}KF.parts=[];KF.dirty=false;KF.loop=null;$('kLoopV').textContent='off';$('kName').textContent=f?f.t:'choose a film';if(f){kv.src=KF.src(f);kv.load();
    scoreGet(f).then(r=>{if(KF.film!==f||KF.dirty)return;KF.parts=scoreParts(r).map(p=>({t:p.t,dur:p.dur,blob:p.blob,mime:p.mime}));KF.by=(r&&r.by)||'';KF.card=(r&&r.card)||0;kfPlayerMake();}).catch(()=>{});}kfPlayerMake();kfView();}
function kfPick(){if(!KF.films.length){say('open me from the movie room for films');return}if(KF.dirty){kfKeep();return}
  openSheet('FILM',KF.films.map(f=>({label:f.t,sub:f.by+' · '+f.len,sel:KF.film===f,quiet:true,act:()=>kfSet(f)})),220)}
/* MOVING ABOUT WHILE YOU PRACTISE (Jackie, Nov 27: "you should also be able to easily go back or forward when practicing during
   playback"). BACK and ON step ten seconds; dragging along the bar goes anywhere. LOOP: the first tap marks where a stretch starts,
   the second where it ends, and the film then goes round that stretch until a third tap lets it run on. */
function kfPlayUI(){$('kPlayV').textContent=kv.paused?'▶ play':'❚❚ pause';}
function kfBusy(){return KF.scoring||!!KF.count}
function kfQuiet(){clearTimeout(KF.count);KF.count=0;KF.arming=false;$('kcount').classList.remove('on');if(KF.scoring){KF.scoring=false;const n0=takes.length;stopRec();setTimeout(()=>{if(takes.length>n0){takes.pop();syncTakes()}},500);} /* a part cut off by leaving is not kept */try{kv.pause()}catch(e){}$('kGo').classList.remove('recording');$('kGoV').textContent='● rec';kfPlayUI();}
function kfPlay(){if(!KF.film){kfPick();return}if(kfBusy())return;if(kv.paused){if(kv.ended)try{kv.currentTime=0}catch(e){}const p=kv.play();if(p&&p.catch)p.catch(()=>say('the film needs a connection'));}else kv.pause();}
function kfSeekTo(t){if(!KF.film||kfBusy())return;const d=kv.duration||0;try{kv.currentTime=clamp(t,0,d?d-.1:0)}catch(e){}kfTick();}
function kfLoop(){if(!KF.film||kfBusy())return;const t=kv.currentTime;if(!KF.loop){KF.loop={a:t,b:null};$('kLoopV').textContent='end?';say('loop starts here · tap again at its end');}
  else if(KF.loop.b==null){if(t<KF.loop.a+.5){say('too short · play on a little');return}KF.loop.b=t;$('kLoopV').textContent='on';try{kv.currentTime=KF.loop.a}catch(e){}}
  else{KF.loop=null;$('kLoopV').textContent='off';}kfBar();}
function kfTick(){const d=kv.duration||0,t=kv.currentTime||0;if(d)$('kbarH').style.left=(t/d*100)+'%';$('kTime').textContent=fmt(t)+(d?' / '+fmt(d):'');
  if(KF.loop&&KF.loop.b!=null&&!kfBusy()&&!kv.paused&&t>=KF.loop.b)try{kv.currentTime=KF.loop.a}catch(e){}
  if(KF.player)KF.player.sync(t,!kv.paused);} // the parts already recorded are heard while you practise and while you add another
setInterval(kfTick,100);kv.addEventListener('play',kfPlayUI);kv.addEventListener('pause',kfPlayUI);kv.addEventListener('loadedmetadata',kfBar);
{const bar=$('kbar'),go=e=>{const r=bar.getBoundingClientRect();kfSeekTo((e.clientX-r.left)/r.width*(kv.duration||0))};let down=false;
  bar.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();down=true;try{bar.setPointerCapture(e.pointerId)}catch(_){}go(e)});bar.addEventListener('pointermove',e=>{if(down)go(e)});['pointerup','pointercancel'].forEach(ev=>bar.addEventListener(ev,()=>{down=false}));}
function kfStop(){if(KF.count){kfQuiet();say('not recorded');return}if(!KF.scoring)return;KF.scoring=false;KF.arming=false;kv.pause();$('kGo').classList.remove('recording');$('kGoV').textContent='● rec';const n0=takes.length,t0=KF.t0;stopRec();
  let tries=0;const wait=()=>{if(takes.length>n0){const tk=takes.pop();syncTakes();KF.parts.push({t:t0,dur:tk.dur,blob:tk.blob,mime:tk.mime});KF.dirty=true;kfPlayerMake();say('part '+KF.parts.length+' · '+fmt(t0)+' to '+fmt(t0+tk.dur));}else if(++tries<30)setTimeout(wait,100);};wait();}
function kfGo(){if(kfBusy()){kfStop();return}if(!KF.film){kfPick();return}if(REC_MIME===null){say('rec not supported here');return}if(!AC)return;if(rec)stopRec();
  kv.pause();if(kv.ended)try{kv.currentTime=0}catch(e){}KF.t0=kv.currentTime||0;$('kGo').classList.add('recording');$('kGoV').textContent='■ stop';const c=$('kcount');let n=3;
  const tick=()=>{if(n>0){c.textContent=n;c.classList.add('on');say('recording in '+n);try{pop(note(n===1?12:0),0,.5)}catch(e){}n--;KF.count=setTimeout(tick,800);return}
    KF.count=0;c.classList.remove('on');KF.arming=true;startRec();if(!rec){kfQuiet();return}const p=kv.play();if(p&&p.catch)p.catch(()=>say('the film needs a connection'));KF.scoring=true;};tick();}
kv.addEventListener('ended',()=>{if(KF.scoring)kfStop();});
/* SAVING (Jackie, Nov 27: "we can elect to add it to our own film library"; "No song title, it's just the score"). SAVE shows the
   parts, each with a button to take it out, and asks who scored it and for a card colour. "save to my films" keeps them all as
   the film's soundtrack; "undo changes" goes back to what was last saved; "keep working" just closes. */
let kkCard=0;
function kfKeep(){if(!KF.film)return;if(!KF.parts.length&&!KF.dirty){say('record a part first');return}kkCard=KF.card||0;try{$('kkBy').value=KF.by||localStorage.getItem('mp-scorer')||''}catch(e){}
  const draw=()=>{const P=KF.parts,bytes=P.reduce((n,p)=>n+p.blob.size,0);$('kkInfo').textContent=KF.film.t+' · '+(P.length?P.length+(P.length>1?' parts':' part')+' · sound for '+fmt(scoreCover(P))+' · '+scoreSize(bytes):'no parts');
    $('kkParts').innerHTML=P.map((p,i)=>'<div><span>'+(i+1)+' · '+fmt(p.t)+' to '+fmt(p.t+p.dur)+'</span><button data-i="'+i+'">take out</button></div>').join('');
    $('kkParts').querySelectorAll('button').forEach(b=>b.onclick=()=>{KF.parts.splice(+b.dataset.i,1);KF.dirty=true;kfPlayerMake();draw();});};draw();
  $('kkCards').innerHTML=KCARDS.map((c,i)=>'<button data-i="'+i+'" style="background:'+c[0]+';color:'+c[1]+'"'+(i===kkCard?' class="on"':'')+'>'+c[2]+'</button>').join('');
  $('kkCards').querySelectorAll('button').forEach(b=>b.onclick=()=>{kkCard=+b.dataset.i;$('kkCards').querySelectorAll('button').forEach(q=>q.classList.toggle('on',q===b));});$('kkeep').classList.add('on');}
function kfKeepEnd(){$('kkeep').classList.remove('on');}
$('kkOn').onclick=kfKeepEnd;
$('kkNo').onclick=()=>{const f=KF.film;kfKeepEnd();KF.dirty=false;kfSet(f);say('back to what was saved');};
$('kkYes').onclick=()=>{const f=KF.film,P=KF.parts;if(!f)return;if(!P.length){$('kkInfo').textContent='There are no parts to save. To remove a saved soundtrack, use Your films in the movie room.';return}
  const by=$('kkBy').value.trim().slice(0,30);scoreRoom(f,P.reduce((n,p)=>n+p.blob.size,0)).then(ok=>{if(!ok){$('kkInfo').textContent='Your films is full. Remove one in the movie room, then save again.';return}
  try{localStorage.setItem('mp-scorer',by)}catch(e){}return scorePut(f,{parts:P,by,card:kkCard,meta:`${SOUNDS[soundI][0]} · ${TUNE()[0]}`}).then(()=>{KF.by=by;KF.card=kkCard;KF.dirty=false;kfPlayerMake();kfKeepEnd();say('saved to your films');try{parent.postMessage('mp-kalimba-score','*')}catch(e){}});}).catch(()=>{$('kkInfo').textContent='It could not be kept on this device.';});};
$('kkeep').addEventListener('pointerdown',e=>e.stopPropagation());
press($('kPick'),kfPick);press($('kPlay'),kfPlay);press($('kGo'),kfGo);press($('kRew'),()=>kfSeekTo(kv.currentTime-10));press($('kFwd'),()=>kfSeekTo(kv.currentTime+10));press($('kLoop'),kfLoop);press($('kMet'),metSheet);press($('kSave'),kfKeep);
press($('kView'),()=>kfSetup());press($('kBack'),()=>{if(kfBusy())kfStop();if(KF.dirty){kfKeep();say('save or undo first');return}kfQuiet();if(KF.player)KF.player.stop();try{parent.postMessage('mp-kalimba-close','*')}catch(e){}});
if(!KF.films.length){$('kfilm').style.display='none';}
else{const box=document.createElement('div');box.id='ksetup';const P=$('panel');[...P.children].forEach(c=>{if(c.id!=='kfilm')box.appendChild(c)});P.insertBefore(box,$('kfilm')); // the instrument's own options, gathered into one strip that SET UP shows
  const tip=document.createElement('button');tip.id='knofilm';tip.type='button';tip.textContent='tap to choose a film';$('kfilm').insertBefore(tip,$('kbar'));press(tip,kfPick);kfView();}
try{const want=new URLSearchParams(location.search).get('film');if(want){const f=KF.films.find(q=>q.id===want);if(f)kfSet(f);}}catch(e){}
addEventListener('load',()=>setTimeout(resize,50));
</script>
