<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Crates · Monster Plant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="js/cratesdb.js"></script>
<style>
/* The shelf sampler's own app (opened from the room by js/sampler.js). Colours: see the palette below.
   RULES.md rule 1 holds here too: flat colours, whole-pixel moves and 2-frame swaps only. */
/* Palette (Jackie, Nov 16): white, greys and black, one orange, and one somewhat bright but tempered blue. Nothing else.
   Orange = holds a sample, or the thing to press. Blue = sounding right now. */
:root{--wall:#d2d2d0;--body:#ececea;--deep:#e0e0de;--k:#1e1e1e;--btn:#fafaf9;--pad:#d0d0ce;--padtx:#1e1e1e;--full:#f26a2c;--fulltx:#1e1e1e;--lit:#5a97e6;--lcd:#1b1b1b;--ink:#f3f3f1;--lcdbar:#333332;--barf:#f26a2c;--acc:#f26a2c;--acctx:#1e1e1e;--dim:#9b9b99;--bw:.45vh}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--wall);font-family:Nunito,ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;font-weight:700;color:var(--k);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;padding:0}
[hidden]{display:none!important}
#m{position:absolute;inset:1.5vh;display:flex;flex-direction:column;gap:2vh;background:var(--body);border:var(--bw) solid var(--k);border-radius:2.4vh;padding:2.5vh}
#top{display:flex;gap:2vh;flex:0 0 19vh}
#lcd{flex:1;min-width:0;background:var(--lcd);color:var(--ink);border:var(--bw) solid var(--k);border-radius:1.6vh;padding:1.2vh 2vh 0;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#l1{font-size:5.6vh;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#l2{font-size:4vh;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{height:3.4vh;margin:0 -2vh;border-top:var(--bw) solid var(--k);background:var(--lcdbar);touch-action:none;cursor:pointer}
#barF{height:100%;width:0;background:var(--barf)}
.b{background:var(--btn);border:var(--bw) solid var(--k);border-radius:1.6vh;font-size:4.2vh;font-weight:800;min-width:13vh;min-height:13vh}
.b:active,.b.down{transform:translate(0,.6vh)}
.b.on{background:var(--lit)}
#x{flex:0 0 19vh}
#mid{flex:1;min-height:0;display:flex;gap:2.5vh}
#dig{flex:0 0 43%;min-width:0;display:flex;flex-direction:column;gap:1.6vh;background:var(--lcd);color:var(--ink);border:var(--bw) solid var(--k);border-radius:1.6vh;padding:1.8vh 2vh 0}
#fs{display:flex;gap:1.4vh}
#q{flex:1;min-width:0;height:11vh;border:0;border-radius:1.2vh;background:var(--lcdbar);color:var(--ink);padding:0 2vh;font-size:16px;outline:none;-webkit-user-select:text;user-select:text}
#q::placeholder{color:var(--dim)}
#fs .b{min-height:11vh;min-width:15vh;background:var(--acc);color:var(--acctx);border:0;border-radius:1.2vh}
#tags{display:flex;gap:1.2vh;overflow-x:auto;flex:0 0 auto;padding-bottom:.4vh;scrollbar-width:none}
#tags::-webkit-scrollbar{display:none}
.t{flex:none;border:var(--bw) solid var(--dim);border-radius:5vh;background:transparent;color:var(--ink);font-size:3.6vh;padding:.6vh 2.2vh;min-height:8vh}
.t.on{background:var(--lit);border-color:var(--lit);color:var(--fulltx)}
.t.s{border-style:dashed}
.t.s.on{background:var(--acc);border-color:var(--acc);border-style:solid;color:var(--acctx)}
#list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;margin:0 -2vh}
.r{flex:none;display:flex;align-items:center;gap:1.5vh;text-align:left;border:0;border-top:1px solid var(--lcdbar);border-radius:0;background:transparent;color:var(--ink);padding:1.2vh 2vh 1.2vh 2.6vh;min-height:12.5vh}
.r.on{background:var(--lcdbar);box-shadow:inset .9vh 0 0 var(--lit)}
.r.on b{color:var(--lit)}
.r small,.r i{color:var(--dim)}
.r span{flex:1;min-width:0}
.r b{display:block;font-size:4vh;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r small{display:block;font-size:3.1vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r i{font-style:normal;font-size:3.4vh}
#note{color:var(--dim);font-size:3.6vh;line-height:1.35;padding:3vh 2vh;text-align:center}
#more{flex:none;min-height:10vh;margin:1.5vh 2vh;background:transparent;color:var(--ink);border-color:var(--dim)}
#right{flex:1;min-width:0;display:flex;flex-direction:column;gap:2vh}
#pads{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:3vh;padding:0 1.4vh 1.4vh 0}
.p{position:relative;background:var(--pad);color:var(--padtx);border:var(--bw) solid var(--k);border-radius:1.6vh;font-size:3.4vh;font-weight:800;touch-action:none;overflow:hidden;padding:1vh;--edge:var(--dim);box-shadow:1.4vh 1.4vh 0 var(--edge)}
.p.full{--edge:var(--full)}
.p.hit{--edge:var(--lit);transform:translate(.8vh,.8vh);box-shadow:.6vh .6vh 0 var(--edge)}
.p.rec{transform:translate(.8vh,.8vh);animation:rec .5s steps(2,jump-none) infinite}
@keyframes rec{0%{box-shadow:.6vh .6vh 0 var(--full)}100%{box-shadow:.6vh .6vh 0 var(--btn)}}
.p u{position:absolute;left:1.2vh;top:.6vh;text-decoration:none;font-size:3.2vh}
.p em{display:block;font-style:normal;line-height:1.15;max-height:100%;overflow:hidden;word-break:break-word}
body.erase .p.full{--edge:var(--k)}
/* the digging screen has three pages: DIG (records), BEAT (tempo, click, recording a loop), SAVED (beats kept on purpose) */
#tabs{display:flex;align-items:center;gap:2.6vh;flex:0 0 auto}
.tab{background:none;border:0;border-bottom:.6vh solid transparent;border-radius:0;color:var(--dim);font-size:3.8vh;font-weight:800;padding:.2vh 0 .4vh;min-height:6.4vh}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)}
#dots{margin-left:auto;display:flex;gap:1vh}
#dots i{width:2.2vh;height:2.2vh;border-radius:.5vh;background:var(--lcdbar)}
#dots i.on{background:var(--lit)}
.pane{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.6vh}
#pBeat{gap:1.3vh;overflow-y:auto;padding-bottom:1.6vh;scrollbar-width:none}
.row{display:flex;align-items:center;gap:1.2vh;flex:none}
.lab{color:var(--dim);font-size:3.2vh;min-width:10vh}
.val{font-size:4.6vh;font-weight:800;min-width:8vh;text-align:center}
.row .t{min-height:8.5vh;min-width:8.5vh;padding:.6vh 1.8vh}
.row .end{margin-left:auto}
.row.big .t{flex:1;font-weight:800}
#bpos{color:var(--dim);font-size:3.2vh}
#save{background:var(--acc);color:var(--acctx);border:0}
#slist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;margin:0 -2vh}
body.erase #slist .r b{text-decoration:line-through}
#cinfo{flex:none}
#wave{flex:1;min-height:0;width:100%;display:block;touch-action:none;cursor:ew-resize;margin-bottom:1.6vh}
.two{display:flex;gap:1.4vh;flex:none}
.two .b{flex:1;min-height:10vh;min-width:0;font-size:3.8vh;border-radius:1.2vh}
#finish{background:transparent;color:var(--ink);border-color:var(--dim)}
#finish.arm{background:var(--acc);color:var(--acctx);border-color:var(--acc)}
#wip{color:var(--dim);font-size:3.1vh;flex:none}
.srow{display:flex;align-items:center;border-top:1px solid var(--lcdbar);flex:none}
.srow .r{flex:1;min-width:0;border-top:0}
.srow .t{margin-right:2vh;font-size:3.2vh;min-height:7vh;padding:.4vh 1.6vh}
#tr{display:flex;gap:1.6vh;flex:0 0 14vh}
#tr .b{flex:1;min-width:0}
#tr .w{flex:1.6}
/* the keys under the pads are shades of grey only (Jackie): no colour down here, darker = more important, darkest = on */
#tr .b{background:#c6c6c4}
#tr #play{background:#8a8a88;color:var(--ink)}
#tr #erase{background:#dcdcda}
#tr .b.on,#tr #play.on,#tr #erase.on{background:var(--k);color:var(--ink)}
</style>
</head>
<body>
<div id="m">
  <div id="top">
    <div id="lcd"><div><div id="l1">THE CRATES</div><div id="l2">Pick a record on the left.</div></div><div id="bar"><div id="barF"></div></div></div>
    <button class="b" id="x" aria-label="Back to the room">✕</button>
  </div>
  <div id="mid">
    <div id="dig">
      <div id="tabs"><button class="tab on" type="button" data-p="pDig">DIG</button><button class="tab" type="button" data-p="pBeat">BEAT</button><button class="tab" type="button" data-p="pClip">CLIP</button><button class="tab" type="button" data-p="pSaved">SONGS</button><div id="dots"><i></i><i></i><i></i><i></i></div></div>
      <div class="pane" id="pDig">
      <form id="fs"><input id="q" type="search" enterkeyhint="search" placeholder="blues, banjo, a name…" autocomplete="off" autocapitalize="off"><button class="b" type="submit">DIG</button></form>
      <div id="tags"></div>
      <div id="list"><div id="note">Old records, free for everyone.<br>Dig one up, tap it to play, then hold a pad while the bit you like goes by.</div></div>
      </div>
      <div class="pane" id="pBeat" hidden>
        <div class="row"><span class="lab">TEMPO</span><button class="t" type="button" id="bpmD" aria-label="Slower">−</button><span class="val" id="bpm">90</span><button class="t" type="button" id="bpmU" aria-label="Faster">+</button><button class="t end" type="button" id="click">CLICK</button></div>
        <div class="row"><span class="lab">BARS</span><button class="t s bars" type="button" data-n="1">1</button><button class="t s bars" type="button" data-n="2">2</button><button class="t s bars" type="button" data-n="4">4</button><button class="t s end" type="button" id="lock">LOCK</button></div>
        <div class="row"><span class="lab">PITCH</span><button class="t" type="button" id="pitD" aria-label="Lower">−</button><span class="val" id="pit">0</span><button class="t" type="button" id="pitU" aria-label="Higher">+</button><span class="lab end" id="pitPad">pad 1</span></div>
        <div class="row big"><button class="t" type="button" id="rec">● REC</button><button class="t" type="button" id="bplay">▶ PLAY</button><button class="t" type="button" id="clear">CLEAR</button></div>
        <div id="bpos"></div>
      </div>
      <div class="pane" id="pClip" hidden>
        <div id="cinfo" class="lab"></div>
        <canvas id="wave" aria-label="The pad's sound. Drag the orange lines to clip it."></canvas>
        <div class="row big"><button class="t" type="button" id="cplay">▶ PLAY</button><button class="t" type="button" id="creset">RESET</button></div>
      </div>
      <div class="pane" id="pSaved" hidden>
        <div class="two"><button class="b" type="button" id="save">SAVE WORK</button><button class="b" type="button" id="finish">FINISH SONG</button></div>
        <div id="wip"></div>
        <div id="slist"></div>
      </div>
    </div>
    <div id="right">
      <div id="pads"></div>
      <div id="tr">
        <button class="b" id="prev" aria-label="Previous record">⏮</button>
        <button class="b" id="play" aria-label="Play or pause">▶</button>
        <button class="b" id="next" aria-label="Next record">⏭</button>
        <button class="b w" id="erase">ERASE</button>
      </div>
    </div>
  </div>
</div>
<script>
'use strict';
/* The Crates, Monster Plant edition: the sampler on the top shelf.
   Dig up old public-domain records, play one, and hold a pad while it plays to keep that snippet on the pad.
   Light on the phone on purpose: records are streamed, never downloaded whole; moving to another record forgets the
   last one; pads live in memory and are gone when the sampler is closed, unless you save your work on purpose.
   BEAT (Jackie, Nov 16): a tempo, a click, pitch per pad, and a loop of 1, 2 or 4 bars to record pad hits into;
   LOCK snaps recorded hits to the nearest sixteenth. The click is only a guide: it is never part of the loop.
   CLIP: drag the start and end lines over a pad's sound to keep only part of it.
   SONGS: SAVE WORK keeps the one work in progress (it comes back when the sampler opens); FINISH SONG plays the
   loop out into a song, and a song can be sent to the radio on the desk (js/radio.js). All of it lives in this
   site's own storage on the phone (js/cratesdb.js); the game's save is never touched. */
const $=id=>document.getElementById(id);
const el=(t,c,tx)=>{const e=document.createElement(t);if(c)e.className=c;if(tx!=null)e.textContent=tx;return e};
// US sound recordings enter the public domain 100 years after publication, on the following 1 January
const CUT=new Date().getFullYear()-101;
const TAGS=['blues','jazz','ragtime','piano','banjo','fiddle','orchestra','choir','hawaiian','tango','march','organ','whistling','yodel'];
const NPAD=8,MAXCAP=8,KEEP=.6; // pads; longest sample (s); audio kept just behind the playhead (s)
const st={src:'ia78',q:'',page:1,more:false};
let list=[],now=null,erase=false,fails=0,openTok=0,searchTok=0;
const pads=Array(NPAD).fill(null),padEls=[];

/* ---------- screen ---------- */
let holdMsg=0;
function lcd(a,b,ms){if(a!=null)$('l1').textContent=a;if(b!=null)$('l2').textContent=b;holdMsg=ms?performance.now()+ms:0}
const tShort=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function lcdNow(){if(!now||performance.now()<holdMsg)return;const d=player.duration;
  lcd(now.title,(player.paused?'Paused · ':'')+tShort(player.currentTime)+(isFinite(d)?' / '+tShort(d):'')+(now.year?' · '+now.year:'')+(now.artist?' · '+now.artist:''))}

/* ---------- search (the same two libraries as The Crates) ---------- */
const clean=s=>String(s==null?'':Array.isArray(s)?s.join(', '):s);
const seen=new Map(); // answers already fetched, so going back costs nothing
async function getJSON(url,tries=3){
  if(seen.has(url))return seen.get(url);
  const r=await fetch(url);
  if(r.status===429&&tries>1){await new Promise(ok=>setTimeout(ok,1800));return getJSON(url,tries-1)}
  if(!r.ok)throw new Error(r.status===429?'The library is busy. Try again in a moment.':'The library had a hiccup ('+r.status+').');
  const j=await r.json();if(seen.size>30)seen.delete(seen.keys().next().value);seen.set(url,j);return j}
function iaURL(q,rows,page){
  // only the library digitization projects (one disc side per record, with a catalogued date), minus records the Archive has locked
  const p=['mediatype:audio','collection:(georgeblood OR edison-recordings OR 78rpm_bostonpubliclibrary)','year:[1880 TO '+CUT+']','NOT access-restricted-item:true'];
  q=q.replace(/[^\p{L}\p{N}\s'-]/gu,' ').trim();if(q)p.push('('+q+')');
  const u=new URLSearchParams({q:p.join(' AND '),rows,page,output:'json'});
  ['identifier','title','creator','year'].forEach(f=>u.append('fl[]',f));u.append('sort[]','downloads desc');
  return 'https://archive.org/advancedsearch.php?'+u}
async function searchIA(q,page){
  const d=(await getJSON(iaURL(q,24,page))).response;
  return {more:d.start+d.docs.length<Math.min(d.numFound,9990),
    items:d.docs.map(x=>({src:'ia78',key:'ia:'+x.identifier,id:x.identifier,title:clean(x.title)||x.identifier,artist:clean(x.creator),year:x.year||''}))}}
const stripHTML=h=>{const d=new DOMParser().parseFromString(h||'','text/html');return (d.body.textContent||'').replace(/\s+/g,' ').trim()};
async function searchCommons(q,page){
  const lim=40,u=new URLSearchParams({action:'query',format:'json',origin:'*',generator:'search',gsrsearch:'filetype:audio -filemime:midi '+(q.trim()||'music'),
    gsrnamespace:6,gsrlimit:lim,gsroffset:(page-1)*lim,prop:'imageinfo',iiprop:'url|extmetadata|mime',iiextmetadatafilter:'Artist|License|DateTimeOriginal'});
  const d=await getJSON('https://commons.wikimedia.org/w/api.php?'+u),pages=Object.values((d.query&&d.query.pages)||{}).sort((a,b)=>a.index-b.index),items=[];
  for(const p of pages){const ii=p.imageinfo&&p.imageinfo[0];if(!ii)continue;const m=ii.extmetadata||{},lic=((m.License||{}).value||'').toLowerCase();
    if(!/^(pd|cc0)/.test(lic)||/mid/.test(ii.mime||''))continue; // public domain or CC0 only
    items.push({src:'commons',key:'wm:'+p.pageid,title:p.title.replace(/^File:/,'').replace(/\.[a-z0-9]+$/i,''),artist:stripHTML((m.Artist||{}).value).slice(0,60),
      year:(((m.DateTimeOriginal||{}).value||'').match(/\b(1[89]|20)\d\d\b/)||[''])[0],url:ii.url.split('?')[0],mime:ii.mime})}
  return {more:!!(d.continue&&d.continue.gsroffset),items}}
async function runSearch(more){
  const tok=++searchTok,L=$('list');
  if(!more){st.page=1;L.textContent='';list=[];L.appendChild(el('div','','Digging…')).id='note'}else st.page++;
  const old=$('more');if(old)old.remove();
  try{
    const r=await(st.src==='ia78'?searchIA:searchCommons)(st.q,st.page);if(tok!==searchTok)return;
    st.more=r.more;const n=$('note');if(n)n.remove();
    r.items.forEach(it=>{it.card=card(it);list.push(it);L.appendChild(it.card)});
    if(!list.length){if(r.more&&st.page<5)return runSearch(true);L.appendChild(el('div','','Nothing down here. Try another word.')).id='note'}
    else if(r.more){const b=el('button','b','MORE');b.id='more';b.type='button';b.onclick=()=>runSearch(true);L.appendChild(b)}
  }catch(e){if(tok!==searchTok)return;const n=$('note')||L.appendChild(el('div'));n.id='note';n.textContent=e instanceof TypeError?'The sampler needs the internet to dig. Check your connection.':e.message}}
function card(it){
  const c=el('button','r'),s=el('span');c.type='button';s.appendChild(el('b','',it.title));s.appendChild(el('small','',it.artist||'unknown performer'));
  c.appendChild(s);c.appendChild(el('i','',it.year?String(it.year):''));if(now&&now.key===it.key)c.classList.add('on');
  c.onclick=()=>openItem(it);return c}

/* ---------- player: one record at a time, streamed ---------- */
let AC=null,unlockEl=null,silentURL=null,graph=null,chunks=[],cap=null;
const player=new Audio();player.crossOrigin='anonymous';player.preload='none';player.setAttribute('playsinline','');
function silentWavURL(){if(silentURL)return silentURL;const sr=8000,n=sr/2,b=new ArrayBuffer(44+n*2),v=new DataView(b);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  return silentURL=URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
// iPhones: sound even with the silent switch on, by holding a looping silent <audio> in "playback" mode
function unlock(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{if(!unlockEl){unlockEl=document.createElement('audio');unlockEl.src=silentWavURL();unlockEl.loop=true;unlockEl.setAttribute('playsinline','');unlockEl.volume=.01}
    const pr=unlockEl.play();pr&&pr.catch(()=>{})}catch(e){}
  try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;try{AC=new C({sampleRate:44100})}catch(e){AC=new C()}}if(AC.state!=='running')AC.resume()}catch(e){}}
['pointerup','touchend','click'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
const lat=()=>AC?(AC.outputLatency||AC.baseLatency||0):0; // what you hear is this far behind the clock
const REC_SRC=`class R extends AudioWorkletProcessor{constructor(){super();this.n=2048;this.b=new Float32Array(this.n);this.i=0;this.f=0}
process(inp){const c=inp[0],a=c&&c[0],b=c&&(c[1]||c[0]);if(this.i===0)this.f=currentFrame;
for(let k=0;k<128;k++){this.b[this.i++]=a?(a[k]+b[k])*.5:0}
if(this.i>=this.n){this.port.postMessage({b:this.b,n0:this.f});this.b=new Float32Array(this.n);this.i=0}return true}}
registerProcessor('rec',R)`;
function ensureGraph(){
  if(graph)return graph;
  return graph=(async()=>{
    unlock();const src=AC.createMediaElementSource(player);src.connect(AC.destination);
    try{
      await AC.audioWorklet.addModule(URL.createObjectURL(new Blob([REC_SRC],{type:'application/javascript'})));
      const n=new AudioWorkletNode(AC,'rec',{numberOfInputs:1,numberOfOutputs:0,channelCount:2,channelCountMode:'explicit'});
      n.port.onmessage=ev=>onChunk(ev.data.b,ev.data.n0);src.connect(n)
    }catch(e){ // older browsers
      const n=AC.createScriptProcessor(2048,2,1),z=AC.createGain();z.gain.value=0;
      n.onaudioprocess=ev=>{const i=ev.inputBuffer,a=i.getChannelData(0),b=i.getChannelData(1),o=new Float32Array(a.length);for(let k=0;k<o.length;k++)o[k]=(a[k]+b[k])*.5;onChunk(o,Math.round(ev.playbackTime*AC.sampleRate))};
      src.connect(n);n.connect(z);z.connect(AC.destination)}
  })().catch(()=>{})}
// moving on forgets the last record: stop it, hand its buffered audio back to the browser, drop what was heard of it

    lcd(null,'Making the song…');const r=await renderSong(),n=old.reduce((m,x)=>Math.max(m,x.n||0),0)+1;
    const meta={n,name:'Song '+n,made:Date.now(),bpm:SEQ.bpm,bars:SEQ.bars,secs:r.secs,radio:false};
    await cratesTx(['songs','songpcm','work'],'readwrite',tx=>{const q=tx.objectStore('songs').add(meta);q.onsuccess=()=>tx.objectStore('songpcm').put({id:q.result,sr:SONG_SR,pcm:r.pcm});tx.objectStore('work').delete('wip')});
    wipMade=0;dirty=false;wipUI();lcd(null,meta.name+' is finished. Send it to the radio if you like.',3000);drawSaved()
  }catch(e){lcd(null,'There is no room to save on this phone right now.',2800)}}
// listening to a song here
let songSrc=null,songId=null;
function stopSong(){if(songSrc){try{songSrc.onended=null;songSrc.stop()}catch(e){}}songSrc=null;songId=null;document.querySelectorAll('.srow .r').forEach(r=>r.classList.remove('on'))}
async function playSong(m,row){
  const again=songId===m.id;stopSong();if(again)return;unlock();if(!AC)return;
  const d=await cratesGet('songpcm',m.id);if(!d)return lcd(null,'That song could not be found.',2200);
  const n=AC.createBufferSource();n.buffer=cratesBuf(d.pcm,d.sr,AC);n.connect(AC.destination);n.start();songSrc=n;songId=m.id;row.classList.add('on');
  n.onended=()=>{if(songSrc===n)stopSong()};lcd(m.name,tShort(m.secs)+' · '+m.bpm+' BPM',2500)}
async function setRadio(m,on){m.radio=on;await cratesTx(['songs'],'readwrite',tx=>tx.objectStore('songs').put(m));
  lcd(null,on?m.name+' is sent to the radio. It may come on now and then.':m.name+' is off the radio.',2800);drawSaved()}
async function eraseSong(m){if(songId===m.id)stopSong();await cratesTx(['songs','songpcm'],'readwrite',tx=>{tx.objectStore('songs').delete(m.id);tx.objectStore('songpcm').delete(m.id)});
  lcd(null,m.name+' is erased.',2000);drawSaved()}
// beats saved the first way (before work in progress): tap one to make it the work in progress
async function useOldBeat(m){
  if(dirty&&pads.some(Boolean)&&performance.now()>leaveArm){leaveArm=performance.now()+4000;return lcd(null,'Your work is not saved. Tap again to replace it with '+m.name+'.',4000)}
  const r=await cratesGet('pads',m.id);if(!r)return;useWork({bpm:m.bpm,bars:m.bars,lock:m.lock,ev:m.ev,pads:r.pads});dirty=true;wipUI();lcd(null,m.name+' is your work in progress now. SAVE WORK to keep it.',3000)}
async function eraseOldBeat(m){await cratesTx(['beats','pads'],'readwrite',tx=>{tx.objectStore('beats').delete(m.id);tx.objectStore('pads').delete(m.id)});drawSaved()}
async function drawSaved(){
  wipUI();const L=$('slist');let songs=[],old=[];try{songs=await cratesAll('songs');old=await cratesAll('beats')}catch(e){}L.textContent='';
  if(!songs.length&&!old.length){L.appendChild(el('div','','Finished songs show up here. Send one to the radio and it may come on in the room.')).id='note';return}
  songs.sort((a,b)=>b.made-a.made).forEach(m=>{const w=el('div','srow'),c=el('button','r'),s=el('span');c.type='button';
    s.appendChild(el('b','',m.name));s.appendChild(el('small','',tShort(m.secs)+' · '+m.bpm+' BPM · '+when(m.made)));c.appendChild(s);
    c.classList.toggle('on',songId===m.id);c.onclick=()=>erase?eraseSong(m):playSong(m,c);
    const r=el('button','t s'+(m.radio?' on':''),'RADIO');r.type='button';r.setAttribute('aria-label',(m.radio?'Take '+m.name+' off':'Send '+m.name+' to')+' the radio');r.onclick=()=>setRadio(m,!m.radio);
    w.appendChild(c);w.appendChild(r);L.appendChild(w)});
  old.sort((a,b)=>b.made-a.made).forEach(m=>{const c=el('button','r'),s=el('span');c.type='button';
    s.appendChild(el('b','',m.name));s.appendChild(el('small','','an older saved beat · tap to keep working on it'));c.appendChild(s);
    c.onclick=()=>erase?eraseOldBeat(m):useOldBeat(m);L.appendChild(c)})}
$('save').onclick=saveWork;$('finish').onclick=finishSong;

/* ---------- CLIP: keep only part of a pad's sound (Jackie, Nov 16). The sound itself is kept whole; the pad just
   plays from its start line to its end line, so RESET brings it all back. s1 0 = to the end. ---------- */
const CLIP_MIN=.05;
function clipOf(d){const L=d.buf.duration,a=Math.min(d.s0||0,L-CLIP_MIN),b=d.s1?Math.min(d.s1,L):L;return [Math.max(0,a),Math.max(CLIP_MIN/2,b-Math.max(0,a))]}
let clipFor='',peaks=null;
function clipUI(){
  const d=pads[SEQ.sel],cv=$('wave'),r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1,W=Math.max(1,Math.round(r.width*dpr)),H=Math.max(1,Math.round(r.height*dpr));
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;peaks=null}
  const key=SEQ.sel+':'+!!d;if(key!==clipFor)peaks=null;clipFor=key;
  const g=cv.getContext('2d'),css=getComputedStyle(document.documentElement),c=n=>css.getPropertyValue(n).trim();
  g.fillStyle=c('--lcdbar');g.fillRect(0,0,W,H);
  if(!d){$('cinfo').textContent='Pad '+(SEQ.sel+1)+' is empty. Tap a full pad to clip it.';$('cplay').disabled=$('creset').disabled=true;return}
  $('cplay').disabled=$('creset').disabled=false;
  const L=d.buf.duration,[a,len]=clipOf(d),b=a+len,bar=Math.max(1,Math.round(2*dpr)),cols=Math.floor(W/(bar*2));
  if(!peaks||peaks.length!==cols){const x=d.buf.getChannelData(0),per=Math.max(1,Math.floor(x.length/cols));peaks=new Float32Array(cols);
    for(let i=0;i<cols;i++){let m=0;for(let k=i*per,e=Math.min(x.length,k+per);k<e;k++){const v=Math.abs(x[k]);if(v>m)m=v}peaks[i]=m}
    let top=0;peaks.forEach(v=>top=Math.max(top,v));if(top>0)for(let i=0;i<cols;i++)peaks[i]/=top}
  const xa=Math.round(a/L*W),xb=Math.round(b/L*W);
  for(let i=0;i<cols;i++){const x=i*bar*2,h=Math.max(bar,Math.round(peaks[i]*(H*.8)/bar)*bar),y=Math.round((H-h)/2);
    g.fillStyle=x+bar>xa&&x<xb?c('--ink'):c('--dim');g.globalAlpha=x+bar>xa&&x<xb?1:.45;g.fillRect(x,y,bar,h)}
  g.globalAlpha=1;g.fillStyle=c('--acc');const hw=Math.max(2,Math.round(3*dpr)),tab=Math.round(14*dpr);
  [[xa,1],[xb,-1]].forEach(([x,dir])=>{const px=Math.max(0,Math.min(W-hw,dir>0?x:x-hw));g.fillRect(px,0,hw,H);g.fillRect(dir>0?px:px+hw-tab,0,tab,tab);g.fillRect(dir>0?px:px+hw-tab,H-tab,tab,tab)});
  const t1=v=>v.toFixed(2).replace(/0$/,'')+' s';
  $('cinfo').textContent='Pad '+(SEQ.sel+1)+' · '+t1(len)+(len<L-.005?' of '+t1(L):' (the whole sample)')}
(cv=>{let id=null,which=0;
  const at=ev=>{const r=cv.getBoundingClientRect();return Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width))};
  const move=ev=>{const d=pads[SEQ.sel];if(!d)return;const L=d.buf.duration,t=at(ev)*L,[a,len]=clipOf(d),b=a+len;
    if(which<0)d.s0=Math.max(0,Math.min(t,b-CLIP_MIN));else{const e=Math.max(a+CLIP_MIN,Math.min(t,L));d.s1=e>=L-.001?0:e}
    dirty=true;clipUI()};
  cv.addEventListener('pointerdown',ev=>{const d=pads[SEQ.sel];if(!d)return;unlock();id=ev.pointerId;try{cv.setPointerCapture(id)}catch(e){}
    const L=d.buf.duration,[a,len]=clipOf(d),t=at(ev)*L;which=Math.abs(t-a)<=Math.abs(t-(a+len))?-1:1;stopPad(SEQ.sel);move(ev)});
  cv.addEventListener('pointermove',ev=>{if(ev.pointerId===id)move(ev)});
  const up=ev=>{if(ev.pointerId!==id)return;id=null;if(pads[SEQ.sel]){playPad(SEQ.sel);drawPad(SEQ.sel)}}; // let go: hear the clip
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up)})($('wave'));
$('cplay').onclick=()=>{if(pads[SEQ.sel]){unlock();playPad(SEQ.sel)}};
$('creset').onclick=()=>{const d=pads[SEQ.sel];if(!d)return;if(d.s0||d.s1)dirty=true;d.s0=d.s1=0;clipUI();drawPad(SEQ.sel);lcd(null,'Pad '+(SEQ.sel+1)+' plays the whole sample again.',2000)};
addEventListener('resize',()=>{if(!$('pClip').hidden)clipUI()});
loadWork();
chips();sync();beatUI();
</script>
