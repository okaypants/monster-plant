<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Crates · Monster Plant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* The shelf sampler's own app (opened from the room by js/sampler.js). Colours: see the palette below.
   RULES.md rule 1 holds here too: flat colours, whole-pixel moves and 2-frame swaps only. */
/* Palette (Jackie, Nov 16): white, greys and black, one orange, and one somewhat bright but tempered blue. Nothing else.
   Orange = holds a sample, or the thing to press. Blue = sounding right now. */
:root{--wall:#d2d2d0;--body:#ececea;--deep:#e0e0de;--k:#1e1e1e;--btn:#fafaf9;--pad:#d0d0ce;--padtx:#1e1e1e;--full:#f26a2c;--fulltx:#1e1e1e;--lit:#5a97e6;--lcd:#1b1b1b;--ink:#f3f3f1;--lcdbar:#333332;--barf:#f26a2c;--acc:#f26a2c;--acctx:#1e1e1e;--dim:#9b9b99;--bw:.45vh}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--wall);font-family:Nunito,ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;font-weight:700;color:var(--k);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;padding:0}
[hidden]{display:none!important}
#m{position:absolute;inset:1.5vh;display:flex;flex-direction:column;gap:2vh;background:var(--body);border:var(--bw) solid var(--k);border-radius:2.4vh;padding:2.5vh}
#top{display:flex;gap:2vh;flex:0 0 19vh}
#lcd{flex:1;min-width:0;background:var(--lcd);color:var(--ink);border:var(--bw) solid var(--k);border-radius:1.6vh;padding:1.2vh 2vh 0;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#l1{font-size:5.6vh;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#l2{font-size:4vh;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{height:3.4vh;margin:0 -2vh;border-top:var(--bw) solid var(--k);background:var(--lcdbar);touch-action:none;cursor:pointer}
#barF{height:100%;width:0;background:var(--barf)}
.b{background:var(--btn);border:var(--bw) solid var(--k);border-radius:1.6vh;font-size:4.2vh;font-weight:800;min-width:13vh;min-height:13vh}
.b:active,.b.down{transform:translate(0,.6vh)}
.b.on{background:var(--lit)}
#x{flex:0 0 19vh}
#mid{flex:1;min-height:0;display:flex;gap:2.5vh}
#dig{flex:0 0 43%;min-width:0;display:flex;flex-direction:column;gap:1.6vh;background:var(--lcd);color:var(--ink);border:var(--bw) solid var(--k);border-radius:1.6vh;padding:1.8vh 2vh 0}
#fs{display:flex;gap:1.4vh}
#q{flex:1;min-width:0;height:11vh;border:0;border-radius:1.2vh;background:var(--lcdbar);color:var(--ink);padding:0 2vh;font-size:16px;outline:none;-webkit-user-select:text;user-select:text}
#q::placeholder{color:var(--dim)}
#fs .b{min-height:11vh;min-width:15vh;background:var(--acc);color:var(--acctx);border:0;border-radius:1.2vh}
#tags{display:flex;gap:1.2vh;overflow-x:auto;flex:0 0 auto;padding-bottom:.4vh;scrollbar-width:none}
#tags::-webkit-scrollbar{display:none}
.t{flex:none;border:var(--bw) solid var(--dim);border-radius:5vh;background:transparent;color:var(--ink);font-size:3.6vh;padding:.6vh 2.2vh;min-height:8vh}
.t.on{background:var(--lit);border-color:var(--lit);color:var(--fulltx)}
.t.s{border-style:dashed}
.t.s.on{background:var(--acc);border-color:var(--acc);border-style:solid;color:var(--acctx)}
#list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;margin:0 -2vh}
.r{flex:none;display:flex;align-items:center;gap:1.5vh;text-align:left;border:0;border-top:1px solid var(--lcdbar);border-radius:0;background:transparent;color:var(--ink);padding:1.2vh 2vh 1.2vh 2.6vh;min-height:12.5vh}
.r.on{background:var(--lcdbar);box-shadow:inset .9vh 0 0 var(--lit)}
.r.on b{color:var(--lit)}
.r small,.r i{color:var(--dim)}
.r span{flex:1;min-width:0}
.r b{display:block;font-size:4vh;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r small{display:block;font-size:3.1vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r i{font-style:normal;font-size:3.4vh}
#note{color:var(--dim);font-size:3.6vh;line-height:1.35;padding:3vh 2vh;text-align:center}
#more{flex:none;min-height:10vh;margin:1.5vh 2vh;background:transparent;color:var(--ink);border-color:var(--dim)}
#right{flex:1;min-width:0;display:flex;flex-direction:column;gap:2vh}
#pads{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:3vh;padding:0 1.4vh 1.4vh 0}
.p{position:relative;background:var(--pad);color:var(--padtx);border:var(--bw) solid var(--k);border-radius:1.6vh;font-size:3.4vh;font-weight:800;touch-action:none;overflow:hidden;padding:1vh;--edge:var(--dim);box-shadow:1.4vh 1.4vh 0 var(--edge)}
.p.full{--edge:var(--full)}
.p.hit{--edge:var(--lit);transform:translate(.8vh,.8vh);box-shadow:.6vh .6vh 0 var(--edge)}
.p.rec{transform:translate(.8vh,.8vh);animation:rec .5s steps(2,jump-none) infinite}
@keyframes rec{0%{box-shadow:.6vh .6vh 0 var(--full)}100%{box-shadow:.6vh .6vh 0 var(--btn)}}
.p u{position:absolute;left:1.2vh;top:.6vh;text-decoration:none;font-size:3.2vh}
.p em{display:block;font-style:normal;line-height:1.15;max-height:100%;overflow:hidden;word-break:break-word}
body.erase .p.full{--edge:var(--k)}
/* the digging screen has three pages: DIG (records), BEAT (tempo, click, recording a loop), SAVED (beats kept on purpose) */
#tabs{display:flex;align-items:center;gap:2.6vh;flex:0 0 auto}
.tab{background:none;border:0;border-bottom:.6vh solid transparent;border-radius:0;color:var(--dim);font-size:3.8vh;font-weight:800;padding:.2vh 0 .4vh;min-height:6.4vh}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)}
#dots{margin-left:auto;display:flex;gap:1vh}
#dots i{width:2.2vh;height:2.2vh;border-radius:.5vh;background:var(--lcdbar)}
#dots i.on{background:var(--lit)}
.pane{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.6vh}
#pBeat{gap:1.3vh;overflow-y:auto;padding-bottom:1.6vh;scrollbar-width:none}
.row{display:flex;align-items:center;gap:1.2vh;flex:none}
.lab{color:var(--dim);font-size:3.2vh;min-width:10vh}
.val{font-size:4.6vh;font-weight:800;min-width:8vh;text-align:center}
.row .t{min-height:8.5vh;min-width:8.5vh;padding:.6vh 1.8vh}
.row .end{margin-left:auto}
.row.big .t{flex:1;font-weight:800}
#bpos{color:var(--dim);font-size:3.2vh}
#save{flex:none;min-height:10vh;background:var(--acc);color:var(--acctx);border:0;border-radius:1.2vh}
#slist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;margin:0 -2vh}
body.erase #slist .r b{text-decoration:line-through}
#tr{display:flex;gap:1.6vh;flex:0 0 14vh}
#tr .b{flex:1;min-width:0}
#tr .w{flex:1.6}
/* the keys under the pads are shades of grey only (Jackie): no colour down here, darker = more important, darkest = on */
#tr .b{background:#c6c6c4}
#tr #play{background:#8a8a88;color:var(--ink)}
#tr #erase{background:#dcdcda}
#tr .b.on,#tr #play.on,#tr #erase.on{background:var(--k);color:var(--ink)}
</style>
</head>
<body>
<div id="m">
  <div id="top">
    <div id="lcd"><div><div id="l1">THE CRATES</div><div id="l2">Pick a record on the left.</div></div><div id="bar"><div id="barF"></div></div></div>
    <button class="b" id="x" aria-label="Back to the room">✕</button>
  </div>
  <div id="mid">
    <div id="dig">
      <div id="tabs"><button class="tab on" type="button" data-p="pDig">DIG</button><button class="tab" type="button" data-p="pBeat">BEAT</button><button class="tab" type="button" data-p="pSaved">SAVED</button><div id="dots"><i></i><i></i><i></i><i></i></div></div>
      <div class="pane" id="pDig">
      <form id="fs"><input id="q" type="search" enterkeyhint="search" placeholder="blues, banjo, a name…" autocomplete="off" autocapitalize="off"><button class="b" type="submit">DIG</button></form>
      <div id="tags"></div>
      <div id="list"><div id="note">Old records, free for everyone.<br>Dig one up, tap it to play, then hold a pad while the bit you like goes by.</div></div>
      </div>
      <div class="pane" id="pBeat" hidden>
        <div class="row"><span class="lab">TEMPO</span><button class="t" type="button" id="bpmD" aria-label="Slower">−</button><span class="val" id="bpm">90</span><button class="t" type="button" id="bpmU" aria-label="Faster">+</button><button class="t end" type="button" id="click">CLICK</button></div>
        <div class="row"><span class="lab">BARS</span><button class="t s bars" type="button" data-n="1">1</button><button class="t s bars" type="button" data-n="2">2</button><button class="t s bars" type="button" data-n="4">4</button><button class="t s end" type="button" id="lock">LOCK</button></div>
        <div class="row"><span class="lab">PITCH</span><button class="t" type="button" id="pitD" aria-label="Lower">−</button><span class="val" id="pit">0</span><button class="t" type="button" id="pitU" aria-label="Higher">+</button><span class="lab end" id="pitPad">pad 1</span></div>
        <div class="row big"><button class="t" type="button" id="rec">● REC</button><button class="t" type="button" id="bplay">▶ PLAY</button><button class="t" type="button" id="clear">CLEAR</button></div>
        <div id="bpos"></div>
      </div>
      <div class="pane" id="pSaved" hidden>
        <button class="b" type="button" id="save">SAVE THIS BEAT</button>
        <div id="slist"></div>
      </div>
    </div>
    <div id="right">
      <div id="pads"></div>
      <div id="tr">
        <button class="b" id="prev" aria-label="Previous record">⏮</button>
        <button class="b" id="play" aria-label="Play or pause">▶</button>
        <button class="b" id="next" aria-label="Next record">⏭</button>
        <button class="b w" id="erase">ERASE</button>
      </div>
    </div>
  </div>
</div>
<script>
'use strict';
/* The Crates, Monster Plant edition: the sampler on the top shelf.
   Dig up old public-domain records, play one, and hold a pad while it plays to keep that snippet on the pad.
   Light on the phone on purpose: records are streamed, never downloaded whole; moving to another record forgets the
   last one; pads live in memory and are gone when the sampler is closed, unless you save the beat on purpose.
   BEAT (Jackie, Nov 16): a tempo, a click, pitch per pad, and a loop of 1, 2 or 4 bars to record pad hits into;
   LOCK snaps recorded hits to the nearest sixteenth. SAVED keeps a beat (its pads, their pitch, the loop) in this
   page's own storage on the phone; the game's save is never touched. */
const $=id=>document.getElementById(id);
const el=(t,c,tx)=>{const e=document.createElement(t);if(c)e.className=c;if(tx!=null)e.textContent=tx;return e};
// US sound recordings enter the public domain 100 years after publication, on the following 1 January
const CUT=new Date().getFullYear()-101;
const TAGS=['blues','jazz','ragtime','piano','banjo','fiddle','orchestra','choir','hawaiian','tango','march','organ','whistling','yodel'];
const NPAD=8,MAXCAP=8,KEEP=.6; // pads; longest sample (s); audio kept just behind the playhead (s)
const st={src:'ia78',q:'',page:1,more:false};
let list=[],now=null,erase=false,fails=0,openTok=0,searchTok=0;
const pads=Array(NPAD).fill(null),padEls=[];

/* ---------- screen ---------- */
let holdMsg=0;
function lcd(a,b,ms){if(a!=null)$('l1').textContent=a;if(b!=null)$('l2').textContent=b;holdMsg=ms?performance.now()+ms:0}
const tShort=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function lcdNow(){if(!now||performance.now()<holdMsg)return;const d=player.duration;
  lcd(now.title,(player.paused?'Paused · ':'')+tShort(player.currentTime)+(isFinite(d)?' / '+tShort(d):'')+(now.year?' · '+now.year:'')+(now.artist?' · '+now.artist:''))}

/* ---------- search (the same two libraries as The Crates) ---------- */
const clean=s=>String(s==null?'':Array.isArray(s)?s.join(', '):s);
const seen=new Map(); // answers already fetched, so going back costs nothing
async function getJSON(url,tries=3){
  if(seen.has(url))return seen.get(url);
  const r=await fetch(url);
  if(r.status===429&&tries>1){await new Promise(ok=>setTimeout(ok,1800));return getJSON(url,tries-1)}
  if(!r.ok)throw new Error(r.status===429?'The library is busy. Try again in a moment.':'The library had a hiccup ('+r.status+').');
  const j=await r.json();if(seen.size>30)seen.delete(seen.keys().next().value);seen.set(url,j);return j}
function iaURL(q,rows,page){
  // only the library digitization projects (one disc side per record, with a catalogued date), minus records the Archive has locked
  const p=['mediatype:audio','collection:(georgeblood OR edison-recordings OR 78rpm_bostonpubliclibrary)','year:[1880 TO '+CUT+']','NOT access-restricted-item:true'];
  q=q.replace(/[^\p{L}\p{N}\s'-]/gu,' ').trim();if(q)p.push('('+q+')');
  const u=new URLSearchParams({q:p.join(' AND '),rows,page,output:'json'});
  ['identifier','title','creator','year'].forEach(f=>u.append('fl[]',f));u.append('sort[]','downloads desc');
  return 'https://archive.org/advancedsearch.php?'+u}
async function searchIA(q,page){
  const d=(await getJSON(iaURL(q,24,page))).response;
  return {more:d.start+d.docs.length<Math.min(d.numFound,9990),
    items:d.docs.map(x=>({src:'ia78',key:'ia:'+x.identifier,id:x.identifier,title:clean(x.title)||x.identifier,artist:clean(x.creator),year:x.year||''}))}}
const stripHTML=h=>{const d=new DOMParser().parseFromString(h||'','text/html');return (d.body.textContent||'').replace(/\s+/g,' ').trim()};
async function searchCommons(q,page){
  const lim=40,u=new URLSearchParams({action:'query',format:'json',origin:'*',generator:'search',gsrsearch:'filetype:audio -filemime:midi '+(q.trim()||'music'),
    gsrnamespace:6,gsrlimit:lim,gsroffset:(page-1)*lim,prop:'imageinfo',iiprop:'url|extmetadata|mime',iiextmetadatafilter:'Artist|License|DateTimeOriginal'});
  const d=await getJSON('https://commons.wikimedia.org/w/api.php?'+u),pages=Object.values((d.query&&d.query.pages)||{}).sort((a,b)=>a.index-b.index),items=[];
  for(const p of pages){const ii=p.imageinfo&&p.imageinfo[0];if(!ii)continue;const m=ii.extmetadata||{},lic=((m.License||{}).value||'').toLowerCase();
    if(!/^(pd|cc0)/.test(lic)||/mid/.test(ii.mime||''))continue; // public domain or CC0 only
    items.push({src:'commons',key:'wm:'+p.pageid,title:p.title.replace(/^File:/,'').replace(/\.[a-z0-9]+$/i,''),artist:stripHTML((m.Artist||{}).value).slice(0,60),
      year:(((m.DateTimeOriginal||{}).value||'').match(/\b(1[89]|20)\d\d\b/)||[''])[0],url:ii.url.split('?')[0],mime:ii.mime})}
  return {more:!!(d.continue&&d.continue.gsroffset),items}}
async function runSearch(more){
  const tok=++searchTok,L=$('list');
  if(!more){st.page=1;L.textContent='';list=[];L.appendChild(el('div','','Digging…')).id='note'}else st.page++;
  const old=$('more');if(old)old.remove();
  try{
    const r=await(st.src==='ia78'?searchIA:searchCommons)(st.q,st.page);if(tok!==searchTok)return;
    st.more=r.more;const n=$('note');if(n)n.remove();
    r.items.forEach(it=>{it.card=card(it);list.push(it);L.appendChild(it.card)});
    if(!list.length){if(r.more&&st.page<5)return runSearch(true);L.appendChild(el('div','','Nothing down here. Try another word.')).id='note'}
    else if(r.more){const b=el('button','b','MORE');b.id='more';b.type='button';b.onclick=()=>runSearch(true);L.appendChild(b)}
  }catch(e){if(tok!==searchTok)return;const n=$('note')||L.appendChild(el('div'));n.id='note';n.textContent=e instanceof TypeError?'The sampler needs the internet to dig. Check your connection.':e.message}}
function card(it){
  const c=el('button','r'),s=el('span');c.type='button';s.appendChild(el('b','',it.title));s.appendChild(el('small','',it.artist||'unknown performer'));
  c.appendChild(s);c.appendChild(el('i','',it.year?String(it.year):''));if(now&&now.key===it.key)c.classList.add('on');
  c.onclick=()=>openItem(it);return c}

/* ---------- player: one record at a time, streamed ---------- */
let AC=null,unlockEl=null,silentURL=null,graph=null,chunks=[],cap=null;
const player=new Audio();player.crossOrigin='anonymous';player.preload='none';player.setAttribute('playsinline','');
function silentWavURL(){if(silentURL)return silentURL;const sr=8000,n=sr/2,b=new ArrayBuffer(44+n*2),v=new DataView(b);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  return silentURL=URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
// iPhones: sound even with the silent switch on, by holding a looping silent <audio> in "playback" mode
function unlock(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{if(!unlockEl){unlockEl=document.createElement('audio');unlockEl.src=silentWavURL();unlockEl.loop=true;unlockEl.setAttribute('playsinline','');unlockEl.volume=.01}
    const pr=unlockEl.play();pr&&pr.catch(()=>{})}catch(e){}
  try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;try{AC=new C({sampleRate:44100})}catch(e){AC=new C()}}if(AC.state!=='running')AC.resume()}catch(e){}}
['pointerup','touchend','click'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
const lat=()=>AC?(AC.outputLatency||AC.baseLatency||0):0; // what you hear is this far behind the clock
const REC_SRC=`class R extends AudioWorkletProcessor{constructor(){super();this.n=2048;this.b=new Float32Array(this.n);this.i=0;this.f=0}
process(inp){const c=inp[0],a=c&&c[0],b=c&&(c[1]||c[0]);if(this.i===0)this.f=currentFrame;
for(let k=0;k<128;k++){this.b[this.i++]=a?(a[k]+b[k])*.5:0}
if(this.i>=this.n){this.port.postMessage({b:this.b,n0:this.f});this.b=new Float32Array(this.n);this.i=0}return true}}
registerProcessor('rec',R)`;
function ensureGraph(){
  if(graph)return graph;
  return graph=(async()=>{
    unlock();const src=AC.createMediaElementSource(player);src.connect(AC.destination);
    try{
      await AC.audioWorklet.addModule(URL.createObjectURL(new Blob([REC_SRC],{type:'application/javascript'})));
      const n=new AudioWorkletNode(AC,'rec',{numberOfInputs:1,numberOfOutputs:0,channelCount:2,channelCountMode:'explicit'});
      n.port.onmessage=ev=>onChunk(ev.data.b,ev.data.n0);src.connect(n)
    }catch(e){ // older browsers
      const n=AC.createScriptProcessor(2048,2,1),z=AC.createGain();z.gain.value=0;
      n.onaudioprocess=ev=>{const i=ev.inputBuffer,a=i.getChannelData(0),b=i.getChannelData(1),o=new Float32Array(a.length);for(let k=0;k<o.length;k++)o[k]=(a[k]+b[k])*.5;onChunk(o,Math.round(ev.playbackTime*AC.sampleRate))};
      src.connect(n);n.connect(z);z.connect(AC.destination)}
  })().catch(()=>{})}
// moving on forgets the last record: stop it, hand its buffered audio back to the browser, drop what was heard of it
function release(){try{player.pause();player.removeAttribute('src');player.load()}catch(e){}chunks=[]}
function setSrc(url){player.src=url;const p=player.play();p&&p.catch(()=>{})}
async function openItem(it){
  if(now&&now.key===it.key)return player.paused?player.play().catch(()=>{}):player.pause();
  const tok=++openTok;endCap(true);release();
  list.forEach(x=>x.card.classList.toggle('on',x===it));
  now={src:it.src,key:it.key,id:it.id,title:it.title,artist:it.artist,year:it.year,alt:null,triedAlt:false};
  lcd(it.title,'Loading…');$('barF').style.width='0';
  await ensureGraph();if(tok!==openTok)return;
  try{
    if(it.src==='commons'){
      const direct=/mpeg|wav/.test(it.mime||''),nm=it.url.split('/').pop();
      now.alt=direct?null:it.url; // a browser that cannot play the MP3 copy gets the original
      return setSrc(direct?it.url:it.url.replace('/commons/','/commons/transcoded/')+'/'+nm+'.mp3')}
    const d=await getJSON('https://archive.org/metadata/'+encodeURIComponent(it.id));if(tok!==openTok)return;
    const files=(d.files||[]).filter(f=>!f.private&&f.name);
    let au=files.filter(f=>/mp3/i.test(f.format||''));if(!au.length)au=files.filter(f=>/flac|wave|ogg|vorbis/i.test(f.format||''));
    if(!au.length)throw new Error('This record has no sound on it.');
    const f=au.find(f=>!f.name.includes('/'))||au[0]; // extra transfers of the same side sit in subfolders
    setSrc('https://archive.org/download/'+encodeURIComponent(it.id)+'/'+f.name.split('/').map(encodeURIComponent).join('/'))
  }catch(e){if(tok===openTok)lcd(null,e instanceof TypeError?'No internet? Check your connection.':e.message)}}
async function step(dir){
  if(!now)return;let i=list.findIndex(x=>x.key===now.key);
  if(dir>0&&i>=list.length-1&&st.more){await runSearch(true);i=list.findIndex(x=>x.key===now.key)}
  const it=list[i+dir];if(!it){if(dir>0)lcd(null,'That was the last one. Dig for more.');return}
  openItem(it);try{it.card.scrollIntoView({block:'nearest'})}catch(e){}}
player.addEventListener('error',()=>{if(!now)return;
  if(now.alt&&!now.triedAlt){now.triedAlt=true;return setSrc(now.alt)}
  lcd(null,'This one will not play. Trying the next…');sync();
  if(++fails<4){const t=openTok;setTimeout(()=>{if(t===openTok)step(1)},1500)}else lcd(null,'These will not play right now. Check your connection.')});
player.addEventListener('waiting',()=>{if(now&&!cap)lcd(null,'Loading…')});
player.addEventListener('playing',()=>{fails=0});
['play','pause','playing','ended'].forEach(ev=>player.addEventListener(ev,()=>{sync();lcdNow()}));
['play','seeking'].forEach(ev=>player.addEventListener(ev,()=>{if(!cap)chunks=[]}));
player.addEventListener('ended',()=>step(1)); // records play one after another
player.addEventListener('timeupdate',()=>{ // the player's own few-times-a-second clock; no per-frame loop
  if(!now)return;const d=player.duration,t=player.currentTime;
  if(isFinite(d)&&d>0)$('barF').style.width=(t/d*100).toFixed(1)+'%';
  if(!cap&&player.readyState>2)lcdNow()});
function seekTo(t){const d=player.duration;if(!now||!isFinite(d))return;endCap(true);player.currentTime=Math.max(0,Math.min(t,d-.2))}
function sync(){
  const off=player.paused||!!player.error||!now;$('play').textContent=off?'▶':'❚❚';$('play').classList.toggle('on',!off);
  $('erase').classList.toggle('on',erase);document.body.classList.toggle('erase',erase)}

/* ---------- pads: hold an empty pad while a record plays to sample onto it; tap a full pad to play it ---------- */
function onChunk(b,n0){
  if(!now||(player.paused&&!cap))return;
  const last=chunks[chunks.length-1];if(last&&n0!==last.n0+last.b.length&&!cap)chunks=[];
  chunks.push({b,n0});const sr=AC.sampleRate,end=n0+b.length;
  if(!cap){while(chunks.length>1&&end-chunks[1].n0>KEEP*sr)chunks.shift();return}
  if(end-cap.n>MAXCAP*sr)endCap()}
function padDown(i){
  unlock();
  if(erase){if(pads[i]){stopPad(i);pads[i]=null;drawPad(i);lcd(null,'Pad '+(i+1)+' is empty again.',1600)}return}
  if(pads[i]){SEQ.sel=i;record(i);playPad(i);beatUI();return}
  if(cap)return;
  if(!now||player.paused||player.readyState<3)return lcd(null,now?'Press ▶, then hold a pad while it plays.':'Play a record first, then hold a pad.',2200);
  cap={i,n:Math.round((AC.currentTime-lat())*AC.sampleRate),t:performance.now()};
  padEls[i].classList.add('rec');lcd(null,'Sampling onto pad '+(i+1)+'… let go to finish.',MAXCAP*1000)}
function padUp(i){if(cap&&cap.i===i)endCap()}
function endCap(drop){
  if(!cap||cap.done)return;const c=cap;c.done=true;
  const sr=AC.sampleRate,e=Math.round((AC.currentTime-lat())*sr);
  const fin=()=>{ // a beat later, so the last of what was heard has arrived
    cap=null;padEls[c.i].classList.remove('rec');if(drop)return;
    const first=chunks.length?chunks[0].n0:0,total=chunks.reduce((a,k)=>a+k.b.length,0),s=Math.max(0,c.n-first),n=Math.min(total,e-first)-s;
    if(n<sr*.08){lcd(null,'Hold the pad a little longer to sample.',2200);return}
    const buf=AC.createBuffer(1,n,sr),out=buf.getChannelData(0);let o=0;
    for(const k of chunks){const a=Math.max(0,s-o),z=Math.min(k.b.length,s+n-o);if(z>a)out.set(k.b.subarray(a,z),o+a-s);o+=k.b.length}
    const f=Math.min(Math.round(sr*.003),n>>2);for(let j=0;j<f;j++){const g=j/f;out[j]*=g;out[n-1-j]*=g} // tiny fades: no clicks
    pads[c.i]={buf,title:now?now.title:'',pitch:0};SEQ.sel=c.i;drawPad(c.i);beatUI();chunks=chunks.slice(-Math.ceil(KEEP*sr/2048));
    lcd(null,'Pad '+(c.i+1)+' holds '+(n/sr).toFixed(1)+' s. Tap it!',2500)};
  drop?fin():setTimeout(fin,140)}
const voices=Array(NPAD).fill(null);
function stopPad(i){const v=voices[i];if(v){voices[i]=null;try{v.onended=null;v.stop()}catch(e){}}padEls[i].classList.remove('hit')}
const rate=p=>Math.pow(2,(p||0)/12); // pitch in semitones; like an old sampler, higher is also faster
const later=[]; // sounds already scheduled, so STOP can cancel them
function voice(i,t){ // one voice per pad: a new hit cuts the last one off
  const old=voices[i];if(old){try{old.onended=null;old.stop(t)}catch(e){}}
  const n=AC.createBufferSource();n.buffer=pads[i].buf;n.playbackRate.value=rate(pads[i].pitch);n.connect(AC.destination);n.start(t);
  n.onended=()=>{if(voices[i]===n){voices[i]=null;padEls[i].classList.remove('hit')}};voices[i]=n;
  later.push(n);if(later.length>64)later.splice(0,later.length-64);return n}
function playPad(i){voice(i,0);padEls[i].classList.add('hit')}
function drawPad(i){const p=padEls[i],d=pads[i];p.classList.toggle('full',!!d);p.querySelector('em').textContent=d?d.title:'';
  p.querySelector('u').textContent=(i+1)+(d&&d.pitch?' · '+(d.pitch>0?'+':'')+d.pitch:'')}
for(let i=0;i<NPAD;i++){const p=el('button','p');p.type='button';p.appendChild(el('u','',String(i+1)));p.appendChild(el('em'));
  let id=null;
  p.addEventListener('pointerdown',ev=>{id=ev.pointerId;try{p.setPointerCapture(id)}catch(e){}ev.preventDefault();padDown(i)});
  const up=ev=>{if(ev.pointerId===id){id=null;padUp(i)}};p.addEventListener('pointerup',up);p.addEventListener('pointercancel',up);
  p.addEventListener('contextmenu',ev=>ev.preventDefault());
  padEls.push(p);$('pads').appendChild(p)}

/* ---------- controls ---------- */
function chips(){const T=$('tags');T.textContent='';
  [['ia78','78s'],['commons','WIKI']].forEach(([k,n])=>{const c=el('button','t s',n);c.type='button';c.classList.toggle('on',st.src===k);c.onclick=()=>{st.src=k;chips();if(list.length||st.q)runSearch()};T.appendChild(c)});
  TAGS.forEach(t=>{const c=el('button','t',t);c.type='button';c.classList.toggle('on',st.q===t);c.onclick=()=>{st.q=t;$('q').value=t;chips();runSearch()};T.appendChild(c)})}
$('fs').onsubmit=ev=>{ev.preventDefault();st.q=$('q').value.trim();$('q').blur();chips();runSearch()};
$('play').onclick=()=>{if(!now)return lcd(null,'Pick a record on the left first.',2000);if(player.paused)player.play().catch(()=>{});else{endCap(true);player.pause()}};
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('erase').onclick=()=>{erase=!erase;sync();lcd(null,erase?'Tap a pad, or a saved beat, to erase it.':'',erase?4000:1)};
(b=>{let id=null;const go=ev=>{const r=b.getBoundingClientRect();seekTo(Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width))*player.duration)};
  b.addEventListener('pointerdown',ev=>{id=ev.pointerId;try{b.setPointerCapture(id)}catch(e){}go(ev)});
  b.addEventListener('pointermove',ev=>{if(ev.pointerId===id)go(ev)});
  const up=ev=>{if(ev.pointerId===id)id=null};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up)})($('bar'));
// back to the room: stop everything first; the room then throws this whole page away, pads and all
function leave(){endCap(true);release();clockStop();for(let i=0;i<NPAD;i++)stopPad(i);try{unlockEl&&unlockEl.pause()}catch(e){}
  if(parent!==window)parent.postMessage('mp-sampler-close','*');else history.back()}
$('x').onclick=leave;addEventListener('keydown',e=>{if(e.key==='Escape')leave()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)endCap(true)});

/* ---------- BEAT: tempo, click, a loop of pad hits ---------- */
const SEQ={bpm:90,bars:2,click:false,lock:true,ev:[],sel:0,on:false,play:false,rec:false,count:false,a0:0,b0:0,start:0,nextClick:0,upTo:0,timer:null};
const BPM_MIN=40,BPM_MAX=200,GRID=4/* LOCK: sixteenths */,AHEAD=.12,MAXEV=600,MAXSAVE=12;
const spb=()=>60/SEQ.bpm,loopLen=()=>SEQ.bars*4;
const beatAt=t=>SEQ.b0+(t-SEQ.a0)/spb(),timeAt=b=>SEQ.a0+(b-SEQ.b0)*spb();
function clockStart(){if(SEQ.on)return true;unlock();if(!AC)return false;
  SEQ.on=true;SEQ.a0=AC.currentTime+.08;SEQ.b0=0;SEQ.nextClick=0;SEQ.upTo=0;SEQ.timer=setInterval(tick,25);return true}
function seqStop(){SEQ.play=SEQ.rec=SEQ.count=false;later.splice(0).forEach(n=>{try{n.onended=null;n.stop()}catch(e){}});
  for(let i=0;i<NPAD;i++){voices[i]=null;padEls[i].classList.remove('hit')}}
function clockStop(){seqStop();SEQ.on=false;clearInterval(SEQ.timer);SEQ.timer=null;dots(-1);beatUI()}
function setBpm(v){v=Math.max(BPM_MIN,Math.min(BPM_MAX,Math.round(v)));if(v===SEQ.bpm)return;
  if(SEQ.on){const t=AC.currentTime;SEQ.b0=beatAt(t);SEQ.a0=t}SEQ.bpm=v;beatUI()} // a new tempo carries on from where the beat is
function blip(t,one){ // the click: short, higher on the first beat of each bar
  const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=one?1568:1047;g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.3,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+.05);o.connect(g);g.connect(AC.destination);
  o.start(t);o.stop(t+.06);later.push(o)}
function at(t,f){setTimeout(()=>{if(SEQ.on)f()},Math.max(0,(t-AC.currentTime+lat())*1000))} // when it is heard
function tick(){
  if(!SEQ.on)return;const to=beatAt(AC.currentTime+AHEAD);
  while(SEQ.nextClick<to){const b=SEQ.nextClick,t=timeAt(b),cnt=SEQ.count&&b<SEQ.start;
    if(SEQ.click||cnt)blip(t,b%4===0);
    at(t,()=>{dots(((b%4)+4)%4);if(cnt)lcd(null,'Recording in '+(SEQ.start-b)+'…',spb()*1100);
      else if(SEQ.rec&&b===SEQ.start)lcd(null,'Recording. Tap the pads in time.',2000);beatUI(b)});
    SEQ.nextClick++}
  if(SEQ.play){const L=loopLen(),from=Math.max(SEQ.upTo,SEQ.start);
    for(const e of SEQ.ev){if(e.b>=L||!pads[e.p])continue;
      for(let ob=SEQ.start+e.b+Math.max(0,Math.ceil((from-SEQ.start-e.b)/L))*L;ob<to;ob+=L){
        if(ob<from||(e.skip&&ob<e.skip))continue;const p=e.p,v=voice(p,timeAt(ob));at(timeAt(ob),()=>{if(voices[p]===v)padEls[p].classList.add('hit')})}}}
  SEQ.upTo=to}
// a pad hit while recording goes into the loop where it was heard; LOCK moves it to the nearest sixteenth
function record(i){
  if(!SEQ.rec||!SEQ.on)return;const L=loopLen(),b=beatAt(AC.currentTime-lat())-SEQ.start;if(b<-.5)return;
  let ab=Math.floor(Math.max(0,b)/L)*L,pos=Math.max(0,b)-ab;if(SEQ.lock)pos=Math.round(pos*GRID)/GRID;if(pos>=L-1e-6){pos-=L;ab+=L}
  addHit(i,pos,SEQ.start+ab+pos+1e-3)}
function addHit(i,pos,skip){ // skip: this pass already heard it live, so the loop picks it up from the next pass
  if(SEQ.ev.length>=MAXEV)return lcd(null,'The loop is full. CLEAR it to start again.',2400);
  if(SEQ.ev.some(e=>e.p===i&&Math.abs(e.b-pos)<1e-3))return;SEQ.ev.push({p:i,b:pos,skip});beatUI()}
function beatGo(rec){
  if(!pads.some(Boolean))return lcd(null,'Sample onto a pad first.',2200);
  if(!rec&&!SEQ.ev.length)return lcd(null,'Nothing recorded yet. Press REC.',2200);
  const was=SEQ.on;if(!clockStart())return;
  if(!SEQ.play){SEQ.start=was?Math.ceil(beatAt(AC.currentTime+.05)/4)*4:rec?4:0;SEQ.count=rec;SEQ.upTo=0} // from a standstill, REC counts in one bar
  SEQ.play=true;if(rec)SEQ.rec=true;beatUI()}
function beatHalt(){seqStop();if(!SEQ.click)clockStop();beatUI();lcd(null,'Stopped.',1200)}
function dots(k){[...$('dots').children].forEach((d,j)=>d.classList.toggle('on',j===k))}
let lastB=0;
function beatUI(b){if(b!=null)lastB=b;
  $('bpm').textContent=SEQ.bpm;$('click').classList.toggle('on',SEQ.click);$('lock').classList.toggle('on',SEQ.lock);
  document.querySelectorAll('.bars').forEach(x=>x.classList.toggle('on',+x.dataset.n===SEQ.bars));
  const d=pads[SEQ.sel];$('pit').textContent=d?(d.pitch>0?'+':'')+(d.pitch||0):'–';$('pitPad').textContent='pad '+(SEQ.sel+1);
  $('rec').classList.toggle('on',SEQ.rec);$('bplay').classList.toggle('on',SEQ.play);$('bplay').textContent=SEQ.play?'■ STOP':'▶ PLAY';
  const L=loopLen(),n=SEQ.ev.filter(e=>e.b<L).length;let s=n?n+(n===1?' hit':' hits')+' in the loop':'Nothing recorded yet.';
  if(SEQ.play&&lastB>=SEQ.start){const k=(lastB-SEQ.start)%L;s='Bar '+(Math.floor(k/4)+1)+' of '+SEQ.bars+' · '+s}
  $('bpos').textContent=s}
function holdKey(b,f){let t=null;const go=()=>{f();t=setTimeout(go,t?90:420)}; // hold − or + to keep going
  b.addEventListener('pointerdown',ev=>{ev.preventDefault();clearTimeout(t);t=null;go()});
  ['pointerup','pointercancel','pointerleave'].forEach(e=>b.addEventListener(e,()=>{clearTimeout(t);t=null}))}
holdKey($('bpmD'),()=>setBpm(SEQ.bpm-1));holdKey($('bpmU'),()=>setBpm(SEQ.bpm+1));
function nudgePitch(d){const p=pads[SEQ.sel];if(!p)return lcd(null,'Pad '+(SEQ.sel+1)+' is empty. Tap a full pad first.',2200);
  p.pitch=Math.max(-12,Math.min(12,(p.pitch||0)+d));drawPad(SEQ.sel);beatUI();playPad(SEQ.sel)}
$('pitD').onclick=()=>nudgePitch(-1);$('pitU').onclick=()=>nudgePitch(1);
$('click').onclick=()=>{SEQ.click=!SEQ.click;if(SEQ.click){if(clockStart()&&!SEQ.play)SEQ.start=0}else if(!SEQ.play)clockStop();beatUI()};
$('lock').onclick=()=>{SEQ.lock=!SEQ.lock;beatUI();lcd(null,SEQ.lock?'LOCK: new hits snap to the beat.':'LOCK off: hits stay where you play them.',2200)};
document.querySelectorAll('.bars').forEach(x=>x.onclick=()=>{SEQ.bars=+x.dataset.n;beatUI()});
$('rec').onclick=()=>{if(SEQ.rec){SEQ.rec=false;beatUI();lcd(null,'Recording off. The loop keeps playing.',2000)}else beatGo(true)};
$('bplay').onclick=()=>SEQ.play?beatHalt():beatGo(false);
$('clear').onclick=()=>{SEQ.ev=[];beatUI();lcd(null,'The loop is empty again.',1600)};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  ['pDig','pBeat','pSaved'].forEach(id=>$(id).hidden=id!==t.dataset.p);if(t.dataset.p==='pSaved')drawSaved()});

/* ---------- SAVED: beats kept on purpose, in this page's own storage (never the game's save) ---------- */
let dbP=null;
function idb(){return dbP||(dbP=new Promise((ok,no)=>{const r=indexedDB.open('mp-crates',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('beats',{keyPath:'id',autoIncrement:true});r.result.createObjectStore('pads',{keyPath:'id'})};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>{dbP=null;no(r.error)}}))}
function txn(stores,mode,fn){return idb().then(db=>new Promise((ok,no)=>{const tx=db.transaction(stores,mode);let out;
  fn(tx,v=>out=v);tx.oncomplete=()=>ok(out);tx.onerror=tx.onabort=()=>no(tx.error)}))}
const listBeats=()=>txn(['beats'],'readonly',(tx,put)=>{const r=tx.objectStore('beats').getAll();r.onsuccess=()=>put(r.result||[])});
function toI16(f){const o=new Int16Array(f.length);for(let k=0;k<f.length;k++){const v=Math.max(-1,Math.min(1,f[k]));o[k]=v<0?v*32768:v*32767}return o}
async function saveBeat(){
  unlock();const full=pads.filter(Boolean).length;if(!full)return lcd(null,'Sample onto a pad first, then save.',2400);
  try{const old=await listBeats();if(old.length>=MAXSAVE)return lcd(null,'Saved beats are full. ERASE one first.',2600);
    const n=old.reduce((m,x)=>Math.max(m,x.n||0),0)+1;
    const meta={n,name:'Beat '+n,made:Date.now(),bpm:SEQ.bpm,bars:SEQ.bars,lock:SEQ.lock,ev:SEQ.ev.map(e=>({p:e.p,b:e.b})),npads:full};
    const pd=pads.map(d=>d?{title:d.title,pitch:d.pitch||0,sr:d.buf.sampleRate,pcm:toI16(d.buf.getChannelData(0))}:null);
    await txn(['beats','pads'],'readwrite',tx=>{const r=tx.objectStore('beats').add(meta);r.onsuccess=()=>tx.objectStore('pads').put({id:r.result,pads:pd})});
    lcd(null,meta.name+' is saved.',2400);drawSaved()
  }catch(e){lcd(null,'There is no room to save on this phone right now.',2800)}}
async function loadBeat(m){
  unlock();if(!AC)return;
  try{const rec=await txn(['pads'],'readonly',(tx,put)=>{const r=tx.objectStore('pads').get(m.id);r.onsuccess=()=>put(r.result)});
    if(!rec)return lcd(null,'That beat could not be found.',2200);
    clockStop();endCap(true);
    rec.pads.forEach((d,i)=>{stopPad(i);if(!d){pads[i]=null}else{const b=AC.createBuffer(1,d.pcm.length,d.sr),o=b.getChannelData(0);
      for(let k=0;k<o.length;k++)o[k]=d.pcm[k]/32768;pads[i]={buf:b,title:d.title,pitch:d.pitch||0}}drawPad(i)});
    Object.assign(SEQ,{bpm:m.bpm,bars:m.bars,lock:m.lock,ev:m.ev.map(e=>({p:e.p,b:e.b})),sel:Math.max(0,pads.findIndex(Boolean))});
    beatUI();lcd(null,m.name+' is loaded. Press PLAY on the BEAT page.',2800)
  }catch(e){lcd(null,'That beat would not load.',2200)}}
async function eraseBeat(m){await txn(['beats','pads'],'readwrite',tx=>{tx.objectStore('beats').delete(m.id);tx.objectStore('pads').delete(m.id)});
  lcd(null,m.name+' is erased.',2000);drawSaved()}
async function drawSaved(){
  const L=$('slist');let all=[];try{all=await listBeats()}catch(e){}L.textContent='';
  if(!all.length){L.appendChild(el('div','','Saved beats show up here. Saving keeps the pads, their pitch and the loop.')).id='note';return}
  all.sort((a,b)=>b.made-a.made).forEach(m=>{const c=el('button','r'),s=el('span');c.type='button';
    s.appendChild(el('b','',m.name));s.appendChild(el('small','',m.bpm+' BPM · '+m.bars+(m.bars===1?' bar':' bars')+' · '+m.npads+(m.npads===1?' pad':' pads')+' · '+m.ev.length+(m.ev.length===1?' hit':' hits')));
    c.appendChild(s);c.appendChild(el('i','',new Date(m.made).toLocaleDateString(undefined,{month:'short',day:'numeric'})));
    c.onclick=()=>erase?eraseBeat(m):loadBeat(m);L.appendChild(c)})}
$('save').onclick=saveBeat;
chips();sync();beatUI();
</script>
</body>
</html>
