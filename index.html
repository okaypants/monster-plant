.tarot{z-index:51;/* above the game's speech bubbles, name tags and the two corner buttons, which used to cover the edges of the box (Jackie, Nov 17) */overflow:hidden;--tcloth:#fbf7ef;--tpanel:#ffffff;--ttext:#1d1a18;--taccent:#c4155c;--tsub:#16795a;--tquote:#5d5753;--tbtn:#ffffff;--tbtnink:#1d1a18;--ton:#c4155c;--tonink:#ffffff;--tedge:#1d1a18}

.tarot .tbox{position:relative;--bg:var(--tcloth);color:var(--ttext);width:min(760px,100%);height:min(560px,100%);flex:none;box-sizing:border-box;padding:16px 18px 30px;/* the words at the bottom sit clear of the edge (Jackie, Nov 17) */display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px}

.tarot .tbk{left:58px;font-size:36px;line-height:1;padding-bottom:6px}.tarot .tbk[hidden]{display:none}

.tstage{flex:0 1 auto;margin-top:auto;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
.tstage.tfull{flex:1;margin-top:0}.tsay{margin-bottom:auto}.tstage.tfull+.tsay{margin-bottom:0}.tsay:empty{min-height:0!important}

.tarot .tbox.tone1{display:grid;grid-template-columns:auto minmax(0,430px);grid-template-rows:auto minmax(0,1fr);justify-content:center;align-items:center;column-gap:min(5vw,36px);row-gap:10px}
.tbox.tone1 .tpick{grid-column:1/3}.tbox.tone1 .tstage{width:auto;margin:0}.tbox.tone1 .tone .tcard{height:min(62vh,340px)}

.tbox.tone1 .tsumtx{flex-basis:auto;font-size:15px;font-weight:600;-webkit-line-clamp:6}.tbox.tone1 .tnote{flex-basis:auto;justify-content:flex-start}
.tsay{font-size:17px;font-weight:700;line-height:1.35;text-align:center;max-width:620px;min-height:2.6em;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px}
