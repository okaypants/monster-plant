<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- home-screen app: icon, name, full screen (Add to Home Screen on iPhone; install on Android) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monster Plant">
<meta name="theme-color" content="#19101b">
<title>Monster Plant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#19101b;overflow:hidden;font-family:'Fredoka','Nunito','Varela Round',system-ui,sans-serif;color:#fdebc9}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
canvas{display:block;image-rendering:pixelated;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#19101b;color:#fdebc9;align-items:center;justify-content:center;text-align:center;font-size:22px;padding:30px}
@media (orientation:portrait) and (max-width:900px){#rot{display:flex}}
#ui{position:absolute;inset:0;pointer-events:none}
/* UI LOOK (Jackie, Nov 4): rounded Fredoka text, cream pills, soft peach buttons. The room and sprites stay pixel art; only the HTML on top is soft. */
.bubble{position:absolute;pointer-events:auto;background:#fff4e2;color:#4a2a4f;border:2px solid #e8c9a8;border-radius:18px;box-shadow:0 3px 0 #d9b08c;padding:12px 18px;font-size:20px;font-weight:500;line-height:1.35;max-width:380px}
.bubble button{font:inherit;font-size:19px;background:#ffd9b8;color:#4a2a4f;border:none;border-radius:999px;box-shadow:0 2px 0 #e8b48f;margin:8px 6px 0 0;padding:5px 16px;cursor:pointer;transition:transform .12s,background .12s}
.bubble button:hover,.bubble button:focus-visible{background:#ffe6cf;transform:translateY(-1px)}
.bubble button:focus-visible,.screen:not(.journal) button:focus-visible{outline:2px solid #e8a07a;outline-offset:2px}
/* caption: a cream pill at the top centre; --S = room scale (set in fit()); the little tail points at whoever is talking */
#caption{position:absolute;left:0;top:0;max-width:60%;opacity:0;transition:opacity .45s ease;pointer-events:none;z-index:40}
#caption.show{opacity:1}
#caption .ci{background:#fff4e2;color:#4a2a4f;border:2px solid #e8c9a8;border-radius:999px;box-shadow:0 3px 0 #d9b08c;padding:max(5px,calc(var(--S)*10px)) max(14px,calc(var(--S)*28px));font-size:max(16px,calc(var(--S)*31px));font-weight:500;line-height:1.3;text-align:center}
#caption .tail{display:none;position:absolute;top:calc(100% - 1px);width:calc(var(--u)*6);height:calc(var(--u)*3)}
#caption .tail::after{content:'';position:absolute;left:50%;top:0;width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);background:#fff4e2;border-right:2px solid #e8c9a8;border-bottom:2px solid #e8c9a8;border-bottom-right-radius:3px;transform:translate(-50%,-60%) rotate(45deg)}
#caption.talk .tail{display:block}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(25,16,27,.84);pointer-events:auto;text-align:center;gap:16px;padding:20px;box-sizing:border-box}
.screen:not(.journal) h1{font-weight:600;font-size:52px;margin:0;color:#c8d145}
.screen:not(.journal) p{margin:0;font-size:22px;max-width:600px}
.screen:not(.journal) .opts{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.screen:not(.journal) button{font:inherit;font-size:22px;font-weight:500;background:#fff4e2;color:#4a2a4f;border:none;border-radius:999px;box-shadow:0 3px 0 #d9b08c;padding:10px 26px;cursor:pointer;min-width:160px;transition:transform .12s,background .12s}
.screen:not(.journal) button:hover,.screen:not(.journal) button:focus-visible{background:#ffd9b8;transform:translateY(-1px)}
/* NAME TAGS (Jackie, Nov 4): each monster's name in a small cream pill at the bottom left (both, when there are two). Tap one to open its journal page. */
#nameTags{position:absolute;left:1.2%;bottom:2%;display:flex;gap:6px;z-index:30;pointer-events:none}
#nameTags button{pointer-events:auto;font:inherit;font-weight:600;font-size:max(12px,calc(var(--S)*20px));color:#4a2a4f;background:#fff4e2;border:2px solid #e8c9a8;border-radius:999px;padding:max(2px,calc(var(--S)*4px)) max(8px,calc(var(--S)*14px));box-shadow:0 2px 0 #d9b08c;cursor:pointer;opacity:.92}
/* THE STORY (Jackie, Nov 7): a small open book facing us, two cream pages with a dark stepped outline, the book's color as its cover edge */
.story{position:absolute;z-index:44;pointer-events:auto;cursor:pointer;user-select:none;-webkit-user-select:none;font-size:max(11px,calc(var(--S)*27px));font-weight:500;line-height:1.3;color:#4a2a4f}
.story .scover{position:absolute;inset:0;background:var(--bc);outline:max(2px,calc(var(--S)*5px)) solid #341839;padding:max(3px,calc(var(--S)*8px));box-sizing:border-box;display:flex;gap:max(2px,calc(var(--S)*6px));box-shadow:inset 0 0 0 max(2px,calc(var(--S)*6px)) var(--bc)}
.story .spage{flex:1;background:#fff4e2;padding:max(5px,calc(var(--S)*16px)) max(6px,calc(var(--S)*18px));box-sizing:border-box;display:flex;align-items:center;text-align:center;overflow:hidden}
.story .sl{box-shadow:inset -6px 0 0 #f3e2c8}.story .sr{box-shadow:inset 6px 0 0 #f3e2c8}
.story .sturn{position:absolute;top:8%;height:84%;background:#fff4e2;outline:3px solid #341839}
.story .sturn1{left:50%;width:32%}.story .sturn2{left:18%;width:32%}
/* JOURNAL (Jackie, Nov 4): a keepsake book. Cream pages, dark stepped pixel outline; design size 760x446, scaled to fit (fitBook in journal.js). */
.screen.journal{display:block;padding:0;background:rgba(25,16,27,.55);text-align:left}
.jbook{position:absolute;left:50%;top:50%;width:760px;height:446px;transform-origin:50% 50%;color:#4a2a4f;font-weight:500}
.jstep{clip-path:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px))}
.jcover{position:absolute;left:0;top:46px;width:760px;height:400px;background:#341839;box-sizing:border-box}
.jpage{position:absolute;top:6px;width:371px;height:388px;background:#fff4e2;box-sizing:border-box;padding:16px 18px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.jl{left:6px;align-items:center;box-shadow:inset -8px 0 0 #f3e2c8}.jr{right:6px;box-shadow:inset 8px 0 0 #f3e2c8} /* a hard-edged shade by the spine */
.jpix{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.jname{font-size:22px;font-weight:600;text-align:center}
.jrename{border:none;background:none;color:inherit;font:inherit;font-size:22px;font-weight:600;padding:0 6px;cursor:pointer}
.jnameinput{font:inherit;font-size:22px;font-weight:600;color:#4a2a4f;background:#fbecd2;border:none;border-bottom:2px dashed #833343;width:240px;padding:0 4px;outline:none}
.jspecies{font-size:14px;color:#833343;margin-top:-10px}
.jportrait{flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.jgrowth{display:flex;gap:10px;align-items:flex-end}
.jr .jgroup:first-child{padding-right:40px} /* clear of the close corner */
.jborn{font-size:17px;text-align:center}
.jpaws{display:flex;gap:14px;align-items:center;justify-content:center;min-height:50px}
.jlab{font-size:15px;font-weight:600;color:#833343;margin-bottom:3px}
.jrow{display:flex;gap:28px}
.jicons{display:flex;gap:10px;align-items:center;min-height:44px}
.jfav,.jblank{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.jblank{box-sizing:border-box;border:2px dashed #ead8c0;border-radius:8px}
.jpal{display:flex;align-items:flex-end}
.jstamps{display:flex;flex-wrap:wrap;gap:6px}
.jstamp{box-sizing:border-box;min-width:62px;height:26px;padding:3px 8px;border:2px solid #833343;border-radius:6px;font-size:13px;line-height:16px;color:#833343;text-align:center;white-space:nowrap}
.jquirks .jstamp{width:76px;min-width:0;padding:3px 1px;font-size:12px}
.jstamp.jfaint{border:2px dashed #ead8c0}
.jtitle{border-color:#6c61a4;color:#6c61a4;font-weight:600}
.jstickers{display:flex;flex-wrap:wrap;gap:8px}
.jcharm{width:50px;height:50px;padding:0;border:none;background:#fbecd2;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.jcharm.worn{background:#ffd9b8;box-shadow:0 0 0 3px #e8a07a}
.jribs{position:absolute;inset:0 0 auto 0;height:60px}
.jrib{position:absolute;top:6px;width:42px;height:54px;border:none;padding:10px 0 0;cursor:pointer;display:flex;justify-content:center;align-items:flex-start;
 clip-path:polygon(0 0,100% 0,100% 100%,30px 100%,30px calc(100% - 4px),25px calc(100% - 4px),25px calc(100% - 8px),17px calc(100% - 8px),17px calc(100% - 4px),12px calc(100% - 4px),12px 100%,0 100%)}
.jrib.on{top:0;padding-top:8px}
.jclose{position:absolute;right:14px;top:58px;z-index:2;width:34px;height:34px;border:none;border-radius:10px;background:#fff4e2;color:#4a2a4f;font:inherit;font-size:24px;line-height:1;cursor:pointer;box-shadow:0 3px 0 #d9b08c}
.jhand{position:absolute;left:10px;bottom:10px;border:none;background:none;padding:4px;cursor:pointer;opacity:.75}
.jbugnote{position:absolute;left:56px;bottom:8px;border:none;background:none;padding:4px;cursor:pointer}
.jbugask{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:380px;background:#fff4e2;padding:18px;box-sizing:border-box;font-size:18px;text-align:center;outline:4px solid #341839;z-index:3}
.jarrow{position:absolute;bottom:8px;border:none;background:none;padding:6px;cursor:pointer}.jarrow.jprev{left:8px}.jarrow.jnext{right:8px}
.jpair{display:flex;align-items:flex-end;justify-content:center;gap:12px;flex:1;min-height:0}
.jpairpic{display:flex;align-items:flex-end;justify-content:center;min-width:90px}
.jpairmark{align-self:center;min-width:30px;display:flex;justify-content:center}
.jyou{display:flex;align-items:center;justify-content:center;height:100px}
.jdetail{font-size:18px;text-align:center}
.jarchnote{font-size:17px;line-height:1.3;text-align:center}.jarchtop{margin-top:30px}
.jshelf{display:grid;grid-template-columns:repeat(3,100px);gap:10px 12px;justify-content:center}
.jarchbook{width:100px;height:140px;padding:8px 6px 8px 14px;border:none;cursor:pointer;box-shadow:inset 7px 0 0 rgba(52,24,57,.45);box-sizing:border-box;font:inherit;color:#4a2a4f}
.jarchlabel{height:100%;background:#fff4e2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:3px;box-sizing:border-box}
.jarchpic{height:62px;display:flex;align-items:center;justify-content:center}.jarchname{font-size:12px;line-height:1.1;font-weight:600;text-align:center;overflow-wrap:anywhere}
.jwent{font-weight:600;color:#833343}.jpostcard{width:150px;height:96px}.jcharm:disabled{cursor:default}
.jletter{position:absolute;left:50%;top:50%;width:520px;box-sizing:border-box;background:#fff4e2;color:#4a2a4f;padding:24px 28px;font-size:21px;line-height:1.35;font-weight:500;outline:6px solid #341839}
.jlstamp{float:right;width:82px;height:90px;margin:0 0 8px 14px;box-sizing:border-box;border:3px dashed #833343;background:#fbecd2;display:flex;align-items:center;justify-content:center}.jlsign{clear:none;margin-top:12px;font-weight:600;color:#833343}
.jlbtns{clear:both;display:flex;gap:10px;margin-top:14px}.jlbtns button{font:inherit;font-size:20px;background:#ffd9b8;color:#4a2a4f;border:none;border-radius:999px;box-shadow:0 2px 0 #e8b48f;padding:6px 22px;cursor:pointer}
.jmiles{gap:8px 8px}.jmiles .jstamp{min-width:0;width:158px;font-size:14px}
.jdetails{display:flex;gap:22px;justify-content:center;align-items:flex-end;flex-wrap:wrap;padding-bottom:30px}.jdetails .jpaws{min-height:0}
.jl .jgroup{text-align:center}.jl .jgroup .jicons{justify-content:center}
.jbtns{display:flex;gap:10px;justify-content:center;margin-top:12px}
.jbtns button{font:inherit;font-size:17px;background:#ffd9b8;color:#4a2a4f;border:none;border-radius:999px;box-shadow:0 2px 0 #e8b48f;padding:6px 16px;cursor:pointer}
.jturn{position:absolute;top:6px;height:388px;background:#fff4e2;outline:4px solid #341839;z-index:2}
.jturn1{left:380px;width:250px}.jturn2{left:130px;width:250px}
/* treat tray (Jackie, Nov 4): a cream pill beside the SNACKS cabinet, seven thumb-sized treats, no words */
.ttray{position:absolute;z-index:45;pointer-events:auto;display:flex;gap:2px;padding:4px 10px;background:#fff4e2;border:2px solid #e8c9a8;border-radius:999px;box-shadow:0 3px 0 #d9b08c;touch-action:none;user-select:none;-webkit-user-select:none}
.ttreat{width:46px;height:46px;border:none;background:none;padding:2px;margin:0;cursor:grab;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-touch-callout:none}
.ttreat img{max-width:40px;max-height:40px;image-rendering:pixelated;pointer-events:none}
#dbgBtn{position:absolute;right:6px;top:6px;z-index:50;pointer-events:auto;font:inherit;font-size:16px;padding:6px 12px;background:rgba(52,24,57,.5);color:#fdebc9;border:1px solid #6c61a4;border-radius:999px;cursor:pointer;opacity:.8}
#dbgBtn:hover{opacity:1}
#fsBtn{position:absolute;right:92px;top:6px;z-index:50;pointer-events:auto;font:inherit;font-size:18px;line-height:1;padding:6px 10px;background:rgba(52,24,57,.5);color:#fdebc9;border:1px solid #6c61a4;border-radius:999px;cursor:pointer;opacity:.8}
:fullscreen #fsBtn,:-webkit-full-screen #fsBtn{opacity:.4}
/* debug drawer: slides in on the right; the room shrinks to fit beside it (FIT_RIGHT in core.js). Big touch targets for phones. */
#dbg{position:fixed;top:0;right:0;bottom:0;z-index:60;display:none;box-sizing:border-box;background:#19101b;border-left:2px solid #6c61a4;border-radius:16px 0 0 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;
 padding:0 calc(8px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) 8px;font-size:14px;line-height:1.35;color:#fdebc9;overscroll-behavior:contain}
#dbg.open{display:block}
#dbg b{color:#c8d145;font-weight:600}
#dbg button,#dbg select,#dbg input[type=text]{font:inherit;font-size:14px;min-height:40px;background:#341839;color:#fdebc9;border:1px solid #6c61a4;border-radius:12px;padding:4px 10px;margin:2px 4px 2px 0;touch-action:manipulation}
#dbg button.on{background:#c8d145;color:#341839;border-color:#c8d145}
#dbg select{width:100%}
#dbg input[type=text]{width:100%;box-sizing:border-box}
#dbg .dhead{position:sticky;top:0;z-index:2;background:#19101b;padding:6px 0 4px;border-bottom:1px solid #6c61a4}
#dbg .dhead .big{background:#c8d145;color:#341839;font-weight:600}
#dbg .hrow{display:flex;align-items:center}
#dbg .hrow button{min-height:36px;margin:0 0 0 6px}
#dbg .hrow .big{flex:1}
#dbg .keep{width:100%;font-size:13px;min-height:36px;background:#2a1a2e;margin:8px 0 2px}
#dbg .tm{background:#d33d3b;color:#fff;font-weight:600;font-size:12px;padding:2px 6px;border-radius:4px;letter-spacing:1px;white-space:nowrap}
#dbg .status{font-size:11px;line-height:1.3;color:#d8c8b0;margin-top:4px}
#dbg details.grp{border-bottom:1px solid #3d2a44}
#dbg summary{font-size:17px;font-weight:600;color:#c8d145;min-height:44px;line-height:44px;cursor:pointer;list-style-position:inside}
#dbg .gbody{padding:0 0 10px}
#dbg .row{margin:8px 0}
#dbg .row>label{display:block;font-size:13px;color:#d8c8b0;margin-bottom:2px}
#dbg .row output{display:block;font-size:13px;text-align:right;margin-top:-4px}
#dbg input[type=range]{width:100%;height:36px;margin:0;accent-color:#c8d145}
#dbg .seg{display:flex;flex-wrap:wrap}
#dbg .seg button{flex:1 1 auto}
#dbg .btns{display:flex;flex-wrap:wrap;margin:6px 0}
#dbg .play{flex:0 0 auto}
#dbg .nudge{font-size:13px}
#dbg .nudge select{width:auto}
#dbgTab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:60;display:none;font:inherit;font-size:15px;min-height:56px;padding:6px 8px;background:#341839;color:#fdebc9;border:2px solid #6c61a4;border-right:none;border-radius:8px 0 0 8px;cursor:pointer}
#testBadge{position:fixed;left:calc(8px + env(safe-area-inset-left));top:8px;z-index:61;display:none;background:#d33d3b;color:#fff;font-weight:600;font-size:13px;padding:3px 8px;border-radius:4px;letter-spacing:1px;pointer-events:none}
body.testing #testBadge{display:block}
@media (max-height:520px){.bubble{font-size:15px;padding:6px 12px;max-width:290px;border-radius:14px}.bubble button{font-size:15px;padding:3px 10px}
.screen:not(.journal){gap:6px;padding:8px;justify-content:flex-start;overflow:auto}.screen:not(.journal) h1{font-size:27px}.screen:not(.journal) p{font-size:16px!important}.screen:not(.journal) div{font-size:15px!important}.screen:not(.journal) button{font-size:17px;padding:5px 14px;min-width:100px}#dbgBtn{font-size:13px;padding:3px 8px}}
</style>
</head>
<body>
<div id="rot">Turn your phone sideways to play 🌱</div>
<div id="wrap">
<canvas id="c" width="1670" height="942" aria-label="Monster plant room"></canvas>
<div id="ui">
<div id="nameTags" aria-label="Your monsters"></div>
<div id="caption" role="status" aria-live="polite"><div class="ci"><span class="ct"></span></div><div class="tail"></div></div>
<button id="fsBtn" type="button" aria-label="Full screen">⛶</button>
<button id="dbgBtn" type="button">debug</button>
</div>
</div>
<!-- debug drawer and TEST MODE label sit outside the room, so they stay full size on phones -->
<div id="dbg" role="dialog" aria-label="Debug (test mode)"></div>
<button id="dbgTab" type="button" aria-label="Show debug">◂<br>debug</button>
<div id="testBadge">TEST MODE</div>
<!-- the game code, in sections; order matters (main.js last) -->
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/saving.js"></script>
<script src="js/nudges.js"></script>
<script src="js/names.js"></script>
<script src="js/stories.js"></script>
<script src="js/room.js"></script>
<script src="js/light.js"></script>
<script src="js/plants.js"></script>
<script src="js/care.js"></script>
<script src="js/cat.js"></script>
<script src="js/fidgets.js"></script>
<script src="js/journal.js"></script>
<script src="js/input.js"></script>
<script src="js/start.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
</body>
</html>
