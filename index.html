<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- home-screen app: icon, name, full screen (Add to Home Screen on iPhone; install on Android) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monster Plant">
<meta name="theme-color" content="#19101b">
<title>Monster Plant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#19101b;overflow:hidden;font-family:'Pixelify Sans',monospace;color:#fdebc9}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
canvas{display:block;image-rendering:pixelated;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#19101b;color:#fdebc9;align-items:center;justify-content:center;text-align:center;font-size:22px;padding:30px}
@media (orientation:portrait) and (max-width:900px){#rot{display:flex}}
#ui{position:absolute;inset:0;pointer-events:none}
.bubble{position:absolute;pointer-events:auto;background:#fdebc9;color:#341839;border:3px solid #341839;padding:8px 12px;font-size:16px;line-height:1.35;max-width:320px}
.bubble button{font:inherit;background:#f5ab6b;color:#341839;border:2px solid #341839;margin:4px 4px 0 0;padding:3px 10px;cursor:pointer}
.bubble button:hover,.bubble button:focus{background:#fbbe7b;outline:2px solid #6c61a4}
#caption{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);background:rgba(52,24,57,.85);color:#fdebc9;padding:6px 14px;font-size:17px;opacity:0;transition:opacity .6s;pointer-events:none;max-width:80%;text-align:center}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(25,16,27,.84);pointer-events:auto;text-align:center;gap:14px;padding:20px;box-sizing:border-box}
.screen h1{font-weight:600;font-size:42px;margin:0;color:#c8d145}
.screen p{margin:0;font-size:19px;max-width:520px}
.screen .opts{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.screen button{font:inherit;font-size:20px;background:#fdebc9;color:#341839;border:3px solid #341839;padding:10px 22px;cursor:pointer;min-width:160px}
.screen button:hover,.screen button:focus{background:#c8d145;outline:none}
#dbgBtn{position:absolute;right:6px;top:6px;z-index:50;pointer-events:auto;font:inherit;font-size:16px;padding:6px 12px;background:rgba(52,24,57,.5);color:#fdebc9;border:1px solid #6c61a4;cursor:pointer;opacity:.8}
#dbgBtn:hover{opacity:1}
#fsBtn{position:absolute;right:92px;top:6px;z-index:50;pointer-events:auto;font:inherit;font-size:18px;line-height:1;padding:6px 10px;background:rgba(52,24,57,.5);color:#fdebc9;border:1px solid #6c61a4;cursor:pointer;opacity:.8}
:fullscreen #fsBtn,:-webkit-full-screen #fsBtn{opacity:.4}
#dbg{position:absolute;right:6px;top:44px;z-index:50;pointer-events:auto;background:rgba(25,16,27,.92);border:2px solid #6c61a4;padding:8px 10px;font-size:13px;line-height:1.45;width:280px;display:none;max-height:90%;overflow:auto}
#dbg select,#dbg button{font:inherit;font-size:15px;margin:2px 2px 2px 0}
#dbg b{color:#c8d145;font-weight:600}
@media (max-height:520px){#caption{font-size:12px;padding:3px 8px;max-width:60%;bottom:2%}.bubble{font-size:12px;padding:5px 8px;max-width:240px}.bubble button{padding:2px 6px}
.screen{gap:6px;padding:8px;justify-content:flex-start;overflow:auto}.screen h1{font-size:22px}.screen p{font-size:13px!important}.screen div{font-size:12px!important}.screen button{font-size:14px;padding:5px 12px;min-width:100px}#dbgBtn{font-size:11px;padding:3px 6px}}
</style>
</head>
<body>
<div id="rot">Turn your phone sideways to play 🌱</div>
<div id="wrap">
<canvas id="c" width="1670" height="942" aria-label="Monster plant room"></canvas>
<div id="ui">
<div id="caption" role="status" aria-live="polite"></div>
<button id="fsBtn" type="button" aria-label="Full screen">⛶</button>
<button id="dbgBtn" type="button">debug</button>
<div id="dbg"></div>
</div>
</div>
<!-- the game code, in sections; order matters (main.js last) -->
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/saving.js"></script>
<script src="js/nudges.js"></script>
<script src="js/room.js"></script>
<script src="js/light.js"></script>
<script src="js/plants.js"></script>
<script src="js/care.js"></script>
<script src="js/cat.js"></script>
<script src="js/fidgets.js"></script>
<script src="js/journal.js"></script>
<script src="js/input.js"></script>
<script src="js/start.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
</body>
</html>
