<style>

#dbgBtn:hover{opacity:1}

:fullscreen #fsBtn,:-webkit-full-screen #fsBtn{opacity:.4}
#dbg{position:absolute;right:6px;top:44px;z-index:50;pointer-events:auto;background:rgba(25,16,27,.92);border:2px solid #6c61a4;padding:8px 10px;font-size:13px;line-height:1.45;width:280px;display:none;max-height:90%;overflow:auto}
#dbg select,#dbg button{font:inherit;font-size:15px;margin:2px 2px 2px 0}

.screen{gap:6px;padding:8px;justify-content:flex-start;overflow:auto}.screen h1{font-size:22px}.screen p{font-size:13px!important}.screen div{font-size:12px!important}.screen button{font-size:14px;padding:5px 12px;min-width:100px}#dbgBtn{font-size:11px;padding:3px 6px}}

<script>
'use strict';
const W=1670,H=942; // book room v2 (Jackie's curated room)
const cv=document.getElementById('c'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;
const wrap=document.getElementById('wrap'),ui=document.getElementById('ui');
let S=1;
function fit(){const vw=document.documentElement.clientWidth||innerWidth,vh=document.documentElement.clientHeight||innerHeight;S=Math.min(vw/W,vh/H);cv.style.width=W*S+'px';cv.style.height=H*S+'px';wrap.style.width=W*S+'px';wrap.style.height=H*S+'px';}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,300));addEventListener('load',fit);setInterval(fit,1000);fit(); // keep the whole room on screen on iPad/phones
function img(src){const i=new Image();i.onerror=()=>showErr('could not load '+src);i.src=src;return i;}
const ok=i=>i&&i.complete&&i.naturalWidth>0;
let errShown=0;function showErr(t){if(errShown>4)return;errShown++;let d=document.getElementById('errbox');if(!d){d=document.createElement('div');d.id='errbox';d.style.cssText='position:fixed;left:8px;bottom:8px;max-width:70vw;background:#341839;color:#fdebc9;font:12px monospace;padding:6px 8px;z-index:99;white-space:pre-wrap;opacity:.9';document.body.appendChild(d);}d.textContent+=(d.textContent?'\n':'')+t;}
addEventListener('error',e=>showErr('error: '+e.message+' (line '+e.lineno+')'));
const room=img('room_day.png');
// ROOM STATES (Jackie's 15-image package, each an edit of her default): whole-room swap per time of day + layered pieces
const TIMES=['day','golden','night'],ROOMS={},LOFF={},CURTS={};
for(const t of TIMES){ROOMS[t]=img('room_'+t+'.png');LOFF[t]={floor:img(t+'_floorlamp_off.png'),desk:img(t+'_desklamp_off.png')};CURTS[t]=img(t+'_curtains_closed.png');}
const WIN_SEASON={day:{summer:img('day_window_summer.png'),spring:img('day_window_spring.png'),autumn:img('day_window_autumn.png'),winter:img('day_window_winter.png')},night:{winter:img('night_window_winter.png')}};
const STOOL_EMPTY=img('stool_empty.png');
// exact mixed-lamp rooms from Jackie (used instead of the soft cut-outs when present). key: time + '_' + floor(on/off) + desk(on/off)
const MIX={golden_onoff:img('room_golden_floorOn_deskOff.png'),golden_offon:img('room_golden_floorOff_deskOn.png'),golden_offoff:img('room_golden_floorOff_deskOff.png'),day_c_onoff:img('room_day_closed_floorOn_deskOff.png'),day_c_offon:img('room_day_closed_floorOff_deskOn.png'),day_offoff:img('room_day_floorOff_deskOff.png'),golden_c_offoff:img('room_golden_closed_floorOff_deskOff.png')}; // _c_ = curtains closed
function timeKey(){if(st.night)return 'night';const p=phase(st.dayT);return p==='golden hour'||p==='dusk'?'golden':p==='night'?'night':'day';}
function seasonNow(){const m=new Date().getMonth();return m>=2&&m<=4?'spring':m>=5&&m<=7?'summer':m>=8&&m<=10?'autumn':'winter';}
const CARRY={up:img('carafe_up.png'),tilt:img('carafe_tilt.png'),pour:img('carafe_pour.png')},TREAT_IMG={};['solar','peat','cotton','pizza','plants','fossil','blood'].forEach(k=>TREAT_IMG[k]=img('treat_'+k+'.png'));
const CARRY_SC=.45; // carried items shown smaller than drawn so they fit the hand/room
function drawCarried(im,x,y,sc=CARRY_SC){if(!ok(im))return;y+=(Math.floor(T*2)%2)*2;const w=Math.round(im.naturalWidth*sc),h=Math.round(im.naturalHeight*sc);g.drawImage(im,Math.round(x-w/2),Math.round(y-h/2),w,h);}
const CURT_AT={x:244,y:30},CURT_L=248,CURT_R=668,CURT_MID=456; // closed curtains cut from Jackie's closed-curtain edit (fabric pixels only)
const BABY=[],ELDER=[];for(let i=1;i<=16;i++){const n=String(i).padStart(2,'0');BABY.push(img('baby_'+n+'.png'));ELDER.push(img('elder_'+n+'.png'));}
const BABY_SLEEP=[];for(let i=1;i<=16;i++)BABY_SLEEP.push(img('baby_'+String(i).padStart(2,'0')+'_sleep.png'));
const SLEEP_OFF=[[0, 0], [-4, -1], [-1, 3], [-4, 11], [-1, 3], [-2, 2], [-2, 3], [1, 3], [0, 4], [0, 4], [-2, 4], [-1, 5], [1, -2], [0, 2], [2, 3], [0, 2]]; // sleeping baby offset vs awake (pot-aligned)
const EYE_O=[],EYE_C=[],MOUTH=[];for(let i=1;i<=16;i++){const n=String(i).padStart(2,'0');EYE_O.push(img('eyes_'+n+'_open.png'));EYE_C.push(img('eyes_'+n+'_blink.png'));if(i<=12)MOUTH.push(img('mouthB_'+n+'.png'));}
const FX={};for(const n of['flames','zzz','rumble','dust','thought','puddle','drops','hearts','sparkles','sweat'])FX[n]=[img('fx_'+n+'_1.png'),img('fx_'+n+'_2.png')];
const FX_SCALE=.7; // all reactions a little smaller (Jackie)
function fx(n,x,y,rate=3,ph=0,sc=FX_SCALE){const f=FX[n][(Math.floor(T*rate+ph))%2];if(!ok(f))return;const w=Math.round(f.naturalWidth*sc),h=Math.round(f.naturalHeight*sc);g.drawImage(f,Math.round(x-w/2),Math.round(y-h/2),w,h);}
const EYE_NAMES=['big round','small dot','sparkle','sly cat','square','flower','tall oval','lashed','sleepy','swirl','sinister','slit','three-shine','pink lids','startled','blushing'];
const NAMES=['curl-sprout bun','lobed bun','stacked cone','leafy mop','bulb','rounded crown','pineapple tuft','floppy ears','sprout-ears','spiral','tentacle star','willow mop','octopus','diamond','lobed cloud','cradle lobes'];

/* ---------- palette ---------- */
const C={out:'#341839',wine:'#833343',plum:'#490d40',brick:'#b8594d',rust:'#d37259',coral:'#eb905d',peach:'#f5ab6b',sand:'#fbbe7b',cream:'#fcd6a5',ivory:'#fdebc9',lav:'#8d8bb5',vio:'#6c61a4',navy:'#1f3f8f',g1:'#4f7a16',g2:'#70a71c',g3:'#b8d725',g4:'#f2ec6a',fl1:'#d33d3b',fl2:'#f88c26',fl3:'#fcc93f',blue:'#3c9ab4'};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const rnd=(a,b)=>a+Math.random()*(b-a);
const P=6; // comic-mark pixel size

/* ---------- audio ---------- */
let AC=null,NB=null;
function audioInit(){try{AC=new (window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}
function env(gn,t0,a,peak,dur){gn.gain.setValueAtTime(0.0001,t0);gn.gain.exponentialRampToValueAtTime(peak,t0+a);gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);}
function noise(t0,dur,type,f,q,peak,a=0.02){const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const gn=AC.createGain();env(gn,t0,a,peak,dur);s.connect(fl).connect(gn).connect(AC.destination);s.start(t0,Math.random());s.stop(t0+dur+.05);return {s,fl,gn};}
function tone(t0,dur,type,f0,f1,peak,a=0.02){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t0);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t0+dur);const gn=AC.createGain();env(gn,t0,a,peak,dur);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;o.connect(lp).connect(gn).connect(AC.destination);o.start(t0);o.stop(t0+dur+.05);return o;}
function sfx(n){if(!AC)return;const t=AC.currentTime+.01;switch(n){
case'pour':{const x=noise(t,1.4,'bandpass',1400,.8,.18,.15);const l=AC.createOscillator();l.frequency.value=9;const lg=AC.createGain();lg.gain.value=300;l.connect(lg).connect(x.fl.frequency);l.start(t);l.stop(t+1.5);break;}
case'crinkle':for(let i=0;i<7;i++)noise(t+i*rnd(.03,.07),.03,'highpass',3500,.7,.08,.003);break;
case'rumble':{const o=tone(t,.9,'sine',70,55,.35,.1);const l=AC.createOscillator();l.frequency.value=7;const lg=AC.createGain();lg.gain.value=12;l.connect(lg).connect(o.frequency);l.start(t);l.stop(t+1);break;}
case'hmm':tone(t,.55,'triangle',260,200,.12,.08);break;
case'hum':tone(t,1.1,'sine',392,370,.08,.2);break;
case'purr':{const x=noise(t,1.2,'lowpass',380,1,.3,.1);const l=AC.createOscillator();l.frequency.value=24;const lg=AC.createGain();lg.gain.value=.25;l.connect(lg).connect(x.gn.gain);l.start(t);l.stop(t+1.3);break;}
case'crunch':for(let i=0;i<5;i++)noise(t+i*.09,.06,'lowpass',2200,1,.25,.005);break;
case'slurp':tone(t,.45,'sawtooth',250,700,.06,.05);break;
case'burp':tone(t,.4,'sawtooth',95,60,.12,.03);break;
case'boing':tone(t,.18,'sine',220,620,.15,.01);tone(t+.16,.25,'sine',620,330,.12,.01);break;
case'fsss':noise(t,.6,'highpass',4500,.5,.08,.05);break;
case'sigh':noise(t,.9,'bandpass',700,1.2,.12,.25);break;
case'page':noise(t,.25,'highpass',2500,.6,.1,.02);noise(t+.2,.2,'highpass',3000,.6,.07,.02);break;
case'chime':[660,880,990,1320].forEach((f,i)=>tone(t+i*.12,.6,'sine',f,0,.08,.01));break;
case'giggle':[520,600,540,640].forEach((f,i)=>tone(t+i*.09,.08,'square',f,0,.03,.005));break;
case'blub':tone(t,.15,'sine',300,120,.15,.01);tone(t+.18,.15,'sine',280,110,.12,.01);break;
case'tick':noise(t,.04,'highpass',2000,1,.06,.002);break;
case'soil':noise(t,.3,'lowpass',900,1,.15,.02);break;
case'pop':tone(t,.12,'sine',500,900,.12,.005);break;
}}

/* ---------- world ---------- */
// spots in native room coordinates (base = where the pot bottom sits)
// placement (Jackie): seedlings on the windowsill or desk; babies on the milk crate or book stack; grown plants on the floor. Drag the plant to move it.
const SPOT={sill:{x:478,y:546,light:1.0},desk:{x:1236,y:528,light:.62},crate:{x:338,y:622,light:.85},books:{x:978,y:662,light:.7},rugL:{x:300,y:918,light:.75,name:'by the window'},rugC:{x:545,y:918,light:.6,name:'by the armchair'},rugR:{x:1250,y:918,light:.42,name:'by the desk'}}; // grown spots sit at the front edges so the carafe, books, snacks and curtains stay reachable
const GROUPS={seed:['sill','desk'],baby:['crate','books'],grown:['rugL','rugC','rugR']};
function lightFit(k){const L=daylight(.35)*SPOT[k].light,[lo,hi]=PREFS[st.pref];return L>hi?'Too much sun for a '+st.pref+'-lover.':L<lo?'A bit dark for a '+st.pref+'-lover.':'A good fit: it likes '+(st.pref==='sun'?'sun':st.pref==='shade'?'shade':'the dark')+'.';}
function stageGroup(){return st.stage<4?'seed':st.stage===4?'baby':'grown';}
const drag={on:false,down:false,sx:0,sy:0,justDropped:false};
const STAGES=['seed','sprout','sprout','sprout','kid','teen','teen','adult','adult'];
const PREFS={sun:[.55,1.2],shade:[.25,.62],night:[0,.35]};
const SNACKS=[ // Jackie's treats, good -> evil. Treats are optional; regular servings grow a cultivated trait (names are placeholders)
 {id:'solar',name:'Solar gummies',ge:.10,s:'slurp',trait:'Orbiting sun'},
 {id:'peat',name:'Peat moss',ge:.06,s:'crunch',trait:'Moss sprout'},
 {id:'cotton',name:'Cotton candy',ge:.03,s:'slurp',trait:'Sugar crystal'},
 {id:'pizza',name:'Pizza',ge:0,s:'crunch',trait:'Pizza bow'},
 {id:'plants',name:'Other plants',ge:-.05,s:'crunch',trait:'Lily-of-the-valley'},
 {id:'fossil',name:'Dinosaur fossils',ge:-.08,s:'crunch',trait:'Dino-skull clip'},
 {id:'blood',name:'Blood',ge:-.14,s:'slurp',trait:'Heart-charm bow'}];
const TRAIT_AT=5; // servings to grow a trait
const BOOKS=[{id:'fairy',name:'Fairy tales',ge:.08,lc:0},{id:'almanac',name:'The Almanac of Rules',ge:0,lc:.08},{id:'nonsense',name:'Nonsense poems',ge:0,lc:-.08},{id:'grimoire',name:'Forbidden grimoire',ge:-.1,lc:-.02}];
const TEACH={thirst:'Turning brown: it\'s thirsty. The watering can is wobbling.',hunger:'Mouth open, eyeing the snack jar: it\'s hungry.',attention:'A little frown: it\'s lonely. Pet it, or read it something from the shelf.',lightHi:'A little flame: too much light, and it\'s drying out fast! Click the window to close the curtains.',lightLo:'Shrinking into itself: too dark. Open the curtains.'};
// quiz: four traits, each with a pool of cute questions; answer index -> bit
const QUIZ=[
 [['Rainy day or sunny day?','Rainy day','Sunny day'],['Pick a cloud shape:','A fluffy puff','A pointy wisp'],['Pebble or crystal?','A smooth pebble','A sharp crystal']],
 [['Nap in a teacup or a hammock?','A teacup','A hammock'],['Hide under a mushroom or a tall fern?','A mushroom','A tall fern'],['Snack size?','A tiny crumb','A long noodle']],
 [['Whisper a secret or giggle loudly?','Giggle loudly','Whisper a secret'],['Stretch up or flop down?','Stretch up','Flop down'],['Morning bird or sleepy moth?','Morning bird','Sleepy moth']],
 [['Honey toast or a pickle?','Honey toast','A pickle'],['Smooth stone or crunchy leaf?','Smooth stone','Crunchy leaf'],['Bubble bath or leaf pile?','Bubble bath','Leaf pile']]];

/* ---------- state ---------- */
const KEY='mp-proto-v2';
function fresh(){return {started:false,species:0,stage:-1,timer:0,day:1,dayT:0,night:false,curtain:'open',needs:{thirst:0,hunger:0,attention:0},light:0,lightBad:0,lightState:'ok',ge:0,lc:0,pref:['sun','shade','night'][Math.floor(Math.random()*3)],eye:Math.floor(Math.random()*16),parch:0,credit:0,met:{},over:0,overType:'',nap:0,listen:0,pets:[],hunch:0,hint:{thirst:0,hunger:0,attention:0,light:0},taught:{},speed:2,mode:'visit',hints:'auto',youUsed:-9};}
let st=fresh();
// MORE THAN ONE PLANT (Jackie, Nov 3): 'st' always holds the ACTIVE plant's fields + shared room state; the other plants wait in st.others.
// eachPlant() swaps each one in, so every existing plant function just works on whichever plant is swapped in.
const GLOBAL=new Set(['started','day','dayT','night','curtain','lamp','desk','speed','mode','hints','taught','hint','lastSeen','goldenSaid','catTrust','catGain','catDayN','others','pots','youUsed','nextId','breedDay','giftSeed','bloomT']);
function freshPlant(){const f=fresh(),o={};for(const k in f)if(!GLOBAL.has(k))o[k]=f[k];o.id=(st.nextId=(st.nextId||1)+1);o.stage=0;giveNature(o);return o;}
function giveNature(o){const r=()=>{const v=rnd(.36,.6);return Math.random()<.5?v:-v;};o.nge=r();o.nlc=r();if(Math.random()<.25)(Math.random()<.5?o.nge=0:o.nlc=0);o.ge=o.nge;o.lc=o.nlc;} // most seeds lean two ways; some only one
function swapIn(i){const a={};for(const k of Object.keys(st))if(!GLOBAL.has(k)){a[k]=st[k];delete st[k];}Object.assign(st,st.others[i]);st.others[i]=a;}
function eachPlant(f){f(-1);const n=(st.others||[]).length;for(let i=0;i<n;i++){swapIn(i);try{f(i);}finally{swapIn(i);}}}
function plantCount(){return (st.started&&st.stage>=0?1:0)+(st.others||[]).length;}
function allRaw(){return [st].concat(st.others||[]);}
function otherPos(){return allRaw().filter(p=>p.id!==st.id&&p._pos).map(p=>p._pos);}
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.started)st=Object.assign(fresh(),s);}catch(e){}
st.stage={2:1,3:1,5:6,7:8}[st.stage]??st.stage;if(st.id==null)st.id=1;if(st.nge==null&&st.started){st.nge=Math.abs(st.ge)>.15?st.ge*.8:(Math.random()<.5?.4:-.4);st.nlc=Math.abs(st.lc)>.15?st.lc*.8:(Math.random()<.5?.4:-.4);}st.others=(st.others||[]).map(o=>{const f=fresh(),q={};for(const k in f)if(!GLOBAL.has(k))q[k]=f[k];Object.assign(q,o);if(q.nge==null){q.nge=Math.abs(q.ge)>.15?q.ge*.8:.4*(Math.random()<.5?1:-1);q.nlc=Math.abs(q.lc)>.15?q.lc*.8:.4*(Math.random()<.5?1:-1);}return q;});if(st.speed===1)st.speed=2; // old saves -> the five ages
function save(){st.lastSeen=Date.now();try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}

/* ---------- ui helpers ---------- */
const cap=document.getElementById('caption');let capT=0;
let capLock=0;function say(t,sec=5,lock){const now=performance.now();if(now<capLock&&!lock){setTimeout(()=>say(t,sec),capLock-now+200);return;}if(lock)capLock=now+sec*1000;cap.textContent=t;cap.style.opacity=1;capT=sec;}
let bubble=null;
function closeBubble(){if(bubble){bubble.remove();bubble=null;}}

let dbgBuilt=false;
function renderDbg(){
 if(!dbgBuilt){dbg.innerHTML='<div id="dStat"></div><div id="dCtl"></div>';buildDbgCtl();dbgBuilt=true;}
 dbg.querySelector('#dStat').innerHTML=`<b>Day ${st.day}</b> · ${phase(st.dayT)} (${st.dayT.toFixed(2)}) · curtains ${st.curtain} · cat trust ${(st.catTrust||0).toFixed(2)}<br>
 species #${st.species+1} ${NAMES[st.species]} · ${st.stage<0?'—':STAGES[st.stage]} · likes ${st.pref}<br>
 thirst ${st.needs.thirst.toFixed(2)} · full ${(st.full||0).toFixed(2)} · attention ${st.needs.attention.toFixed(2)}<br>
 light ${st.light.toFixed(2)} (${st.lightState}) · growth ${st.credit.toFixed(2)}<br>
 good↔evil ${st.ge.toFixed(2)} · lawful↔chaotic ${st.lc.toFixed(2)} · <b>${align()}</b><br>
 treats: ${SNACKS.map(t=>t.name.split(' ')[0]+' '+((st.treats||{})[t.id]||0)+'/'+TRAIT_AT).join(' · ')}<br>traits: ${(st.traits||[]).join(', ')||'none yet'}<br><br>
`;}
function buildDbgCtl(){const c=dbg.querySelector('#dCtl');c.innerHTML=` Species <select id="dSpc">${NAMES.map((n,i)=>`<option value="${i}" ${st.species==i?'selected':''}>${i+1} ${n}</option>`).join('')}</select><br>
 Stage <select id="dStg">${AGES.map(i=>`<option value="${i}" ${st.stage==i?'selected':''}>${['seed','sprout','','','kid','','teen','','adult'][i]}</option>`).join('')}</select><br>
 Speed <select id="dSp">${[1,5,20,60].map(v=>`<option ${st.speed==v?'selected':''}>${v}</option>`).join('')}</select>
 Time <select id="dMo">${['visit','ambient','actions'].map(v=>`<option ${st.mode==v?'selected':''}>${v}</option>`).join('')}</select><br>
 Hints <select id="dHi">${['auto','always','off'].map(v=>`<option ${st.hints==v?'selected':''}>${v}</option>`).join('')}</select>
 Eyes <select id="dEy">${EYE_NAMES.map((n,i)=>`<option value="${i}" ${st.eye==i?'selected':''}>${i+1} ${n}</option>`).join('')}</select>
 Disposition <select id="dAl"><option value="">(set…)</option>${['Lawful Good','Neutral Good','Chaotic Good','Lawful Neutral','True Neutral','Chaotic Neutral','Lawful Evil','Neutral Evil','Chaotic Evil'].map(n=>`<option>${n}</option>`).join('')}</select><br>
 Light <select id="dPf">${['sun','shade','night'].map(v=>`<option ${st.pref==v?'selected':''}>${v}</option>`).join('')}</select><br>
 <button id="dPots">All pots</button><button id="dDay">End day</button><button id="dCat">Cat trust +</button><button id="dAdd">Add adult</button><button id="dBreed">Breed now</button><button id="dRe">Reset</button>`;
 const on=(id,f)=>c.querySelector(id).onchange=e=>f(e.target.value);
 on('#dSpc',v=>{st.species=+v;});on('#dStg',v=>{st.stage=+v;st.started=true;});on('#dSp',v=>st.speed=+v);on('#dMo',v=>st.mode=v);on('#dHi',v=>st.hints=v);on('#dPf',v=>st.pref=v);on('#dEy',v=>{st.eye=+v;save();});on('#dAl',v=>{if(!v)return;const[a,b]=v==='True Neutral'?['Neutral','Neutral']:v.split(' ');st.lc=a==='Lawful'?.6:a==='Chaotic'?-.6:0;st.ge=b==='Good'?.6:b==='Evil'?-.6:0;save();});
 c.querySelector('#dPots').onclick=()=>{st.pots=POTS.map(p=>p.id);st.potOn=POTS[(POTS.findIndex(p=>p.id===st.potOn)+1)%POTS.length].id;save();};
 c.querySelector('#dAdd').onclick=()=>{if(plantCount()>=3)return;const p=freshPlant();p.species=Math.floor(Math.random()*16);p.stage=8;addPlant(p);save();};
 c.querySelector('#dBreed').onclick=()=>{const A=allRaw().filter(q=>q.stage>=8);if(A.length>=2&&plantCount()<3)crossPollinate(A[0],A[1]);else say('Needs two adults and fewer than 3 plants.',3);};
 c.querySelector('#dCat').onclick=()=>{const t=catTrust();st.catTrust=t<TRUST_SHY?TRUST_SHY:t<TRUST_FOND?TRUST_FOND:t<TRUST_BFF?TRUST_BFF:0;save();};
 c.querySelector('#dDay').onclick=()=>{st.night=true;wake();};
 c.querySelector('#dRe').onclick=()=>{try{localStorage.removeItem(KEY);}catch(e){}location.reload();};}

</script>
</body>
</html>
